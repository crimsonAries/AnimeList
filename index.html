                while (prev && !(yc = prev.querySelector('td.col-year'))) prev = prev.previousElementSibling;
            }
            return yc || null;
        }

        // 横轴：←/→ 沿时间(行内)移动，↑/↓ 沿名次(换行)移动；空格与底部完成率行均可停留
        function keyNavNeighborH(cell, dir) {
            const tr = cell.closest('tr');
            if (!tr) return null;
            if (dir === 'left' || dir === 'right') {
                const cells = hRowNavCells(tr);
                const i = cells.indexOf(cell);
                if (i < 0) return null;
                return cells[i + (dir === 'left' ? -1 : 1)] || null;
            }
            const up = dir === 'up';
            // 名次格：上下切到相邻行的名次格
            if (cell.matches('td.col-rank')) {
                const nr = up ? tr.previousElementSibling : tr.nextElementSibling;
                return nr ? nr.querySelector('td.col-rank') : null;
            }
            // 名次表头：向下进入首行名次格
            if (cell.matches('th.col-rank')) {
                if (up) return null;
                const first = document.querySelector('#rank-table-body tr');
                return first ? first.querySelector('td.col-rank') : null;
            }
            // 季度表头：向上进入覆盖该季度的年份表头；向下进入首行同列作品格
            if (cell.matches('th.col-quarter')) {
                if (up) {
                    const y = parseInt(cell.dataset.year, 10);
                    return Array.from(document.querySelectorAll('#rank-table-head th.col-year'))
                        .find(th => parseInt(th.dataset.year, 10) === y) || null;
                }
                return hCellIn(document.querySelector('#rank-table-body tr'), 'td.title-col',
                    parseInt(cell.dataset.year, 10), cell.dataset.quarter);
            }
            // 年份表头：向下优先回到"刚才从那按 ↑ 上来的季度表头"；否则进入该年份的第一个季度表头
            if (cell.matches('th.col-year')) {
                if (up) return null;
                const year = parseInt(cell.dataset.year, 10);
                const ret = keyNav.yearReturn;
                if (ret && ret.isConnected && ret.matches('th.col-quarter')
                    && parseInt(ret.dataset.year, 10) === year) {
                    return ret;
                }
                return Array.from(document.querySelectorAll('#rank-table-head th.col-quarter'))
                    .find(th => parseInt(th.dataset.year, 10) === year) || null;
            }
            // 作品格 / 完成率格：按同一季度列上下换名次
            const year = parseInt(cell.dataset.year, 10);
            const quarter = cell.dataset.quarter;
            if (!up) {
                const nr = tr.nextElementSibling;
                if (!nr) return null;
                if (nr.classList.contains('watch-row')) return hCellIn(nr, 'td.col-watch-h', year, quarter);
                return hCellIn(nr, 'td.title-col', year, quarter);
            }
            const pr = tr.previousElementSibling;
            if (!pr) {
                // 首行作品格向上：该列的季度表头
                if (cell.matches('td.title-col')) {
                    return hCellIn(document.querySelector('#rank-table-head'), 'th.col-quarter', year, quarter);
                }
                return null;
            }
            return hCellIn(pr, 'td.title-col', year, quarter);
        }

        function keyNavNeighbor(cell, dir) {
            if (state.timeAxis === 'h') return keyNavNeighborH(cell, dir);
            if (dir === 'left' || dir === 'right') {
                const tr = cell.closest('tr');
                if (!tr) return null;
                const cells = rowFocusableCells(tr);
                const i = cells.indexOf(cell);
                if (i < 0) return null;
                let nb = cells[i + (dir === 'left' ? -1 : 1)] || null;
                // 非首行的季度格左侧没有兄弟格(年份格在块首行 rowspan)：向左到本年度的年份格
                if (!nb && dir === 'left' && cell.matches('td.col-quarter')) {
                    nb = findYearCellOf(tr);
                }
                // 年份格向右：若此前是从某个季度格按 ← 进入年份，则原路返回该季度格
                if (dir === 'right' && cell.matches('td.col-year')) {
                    const ret = keyNav.yearReturn;
                    if (ret && ret.isConnected && ret.matches('td.col-quarter') && findYearCellOf(ret.closest('tr')) === cell) {
                        nb = ret;
                    }
                }
                return nb;
            }
            const up = dir === 'up';
            const tr = cell.closest('tr');
            if (!tr) return null;
            // 年份格：上下切到相邻年份块的年份格
            if (cell.matches('td.col-year')) {
                let r = up ? tr.previousElementSibling : tr.nextElementSibling;
                while (r) {
                    const yc = r.querySelector('td.col-year');
                    if (yc) return yc;
                    r = up ? r.previousElementSibling : r.nextElementSibling;
                }
                return null;
            }
            if (cell.matches('th.rank-header')) {
                // 表头"第N名"：向下进入该列首行的作品名格
                if (up) return null;
                const idx = Array.from(document.querySelectorAll('#rank-table-head th.rank-header')).indexOf(cell);
                const firstRow = document.querySelector('#rank-table-body tr');
                if (idx < 0 || !firstRow) return null;
                return firstRow.querySelectorAll('td.title-col')[idx] || null;
            }
            if (cell.matches('td.title-col') && up && !tr.previousElementSibling) {
                // 首行作品名格：向上到"第N名"表头
                const idx = Array.from(tr.querySelectorAll('td.title-col')).indexOf(cell);
                const ths = document.querySelectorAll('#rank-table-head th.rank-header');
                return (idx >= 0 && ths[idx]) ? ths[idx] : null;
            }
            const cls = cell.matches('td.title-col') ? 'td.title-col'
                : cell.matches('td.col-quarter') ? 'td.col-quarter'
                : cell.matches('td.col-watch') ? 'td.col-watch'
                : cell.matches('td.col-rank') ? 'td.col-rank'
                : cell.matches('td.col-watch-h') ? 'td.col-watch-h' : null;
            if (!cls) return null;
            const nr = up ? tr.previousElementSibling : tr.nextElementSibling;
            if (!nr) return null;
            if (cls === 'td.title-col') {
                const idx = Array.from(tr.querySelectorAll('td.title-col')).indexOf(cell);
                return nr.querySelectorAll('td.title-col')[idx] || null;
            }
            return nr.querySelector(cls);
        }

        // 滚动使当前格完整显示：避让粘性表头(顶)、年份/季度列(左)、完成率列(右)
        function scrollCellIntoView(cell) {
            const box = cell.closest('.table-container');
            if (!box) return;
            const cr = box.getBoundingClientRect();
            const r = cell.getBoundingClientRect();
            // 内容可视区：排除竖向/横向滚动条与边框(clientWidth/clientHeight)
            const cLeft = cr.left + box.clientLeft;
            const cTop = cr.top + box.clientTop;
            const cRight = cLeft + box.clientWidth;
            const cBottom = cTop + box.clientHeight;
            const theadEl = box.querySelector('#rank-table-head');
            const headH = theadEl ? theadEl.getBoundingClientRect().height : 32;
            const horizontal = state.timeAxis === 'h';
            // 横轴：左侧粘住的是"名次"列，且没有右侧粘住的完成率列
            const stickyLEl = horizontal
                ? box.querySelector('#rank-table-head th.col-rank')
                : box.querySelector('#rank-table-head th.col-quarter');
            const stickyL = stickyLEl ? (stickyLEl.getBoundingClientRect().right - cLeft) : 100;
            const wc = horizontal ? null
                : (box.querySelector('#rank-table-body td.col-watch') || box.querySelector('#rank-table-head th.col-watch'));
            const stickyR = wc ? (cRight - wc.getBoundingClientRect().left) : (horizontal ? 0 : 64);
            // 横轴底部有粘性完成率行：可视下边界取该行可见上沿(精确，避免浮点高度误差)
            const footEl = horizontal ? box.querySelector('#rank-table-body tr.watch-row td') : null;
            const visLeft = cLeft + stickyL;
            const visRight = cRight - stickyR;
            const visTop = cTop + headH;
            const visBottom = footEl ? footEl.getBoundingClientRect().top : cBottom;
            // 作品名格：连同右侧评级格一起保证完整入画
            let rightEdge = r.right;
            if (cell.matches('td.title-col')) {
                const icon = cell.nextElementSibling;
                if (icon && icon.classList.contains('icon-col')) rightEdge = icon.getBoundingClientRect().right;
            }
            // 粘性格在该方向上始终可见，无需滚动
            const stickyX = horizontal ? cell.matches('td.col-rank') : cell.matches('.col-year, .col-quarter, .col-watch');
            const stickyY = cell.tagName === 'TH' || (horizontal && cell.matches('td.col-watch-h'));
            let dx = 0, dy = 0;
            if (!stickyX) {
                if (r.left < visLeft) dx = r.left - visLeft;
                else if (rightEdge > visRight) dx = rightEdge - visRight;
            }
            if (!stickyY) {
                if (r.top < visTop) dy = r.top - visTop;
                else if (r.bottom > visBottom) dy = r.bottom - visBottom;
            }
            if (dx) box.scrollLeft += dx;
            if (dy) box.scrollTop += dy;
        }

        // 设为指定行列标记(与鼠标点击后的效果一致，但不做"再点取消")
        function setHeaderMark(mark) {
            headerMark = mark;
            clearSingleCellSelection();
            resetDetailView();
            paintMark();
            showSelectionTip();
        }

        // 与鼠标点击同口径地应用选中效果
        function applyKeyNavSelection(cell) {
            if (cell.matches('td.title-col')) {
                if (cell.dataset.sid) selectAnime(cell.dataset.sid);
                else selectEmptyCell(cell); // 空格：白框跟随到该格(四框与作品选中一致)
                return;
            }
            // 横轴：名次格标记该名次；完成率格按季度标记(来源=完成率)；表头格标记季度/年份
            if (cell.matches('td.col-rank')) {
                const ri = parseInt(cell.dataset.ri, 10);
                if (!isNaN(ri)) setHeaderMark({ type: 'rank', index: ri });
                return;
            }
            if (cell.matches('td.col-watch-h')) {
                const y = parseInt(cell.dataset.year, 10);
                if (!isNaN(y) && cell.dataset.quarter) {
                    setHeaderMark({ type: 'quarter', year: y, quarter: cell.dataset.quarter, from: 'watch' });
                }
                return;
            }
            if (cell.matches('th.col-quarter')) {
                const y = parseInt(cell.dataset.year, 10);
                if (!isNaN(y) && cell.dataset.quarter) setHeaderMark({ type: 'quarter', year: y, quarter: cell.dataset.quarter });
                return;
            }
            if (cell.matches('th.col-year')) {
                const y = parseInt(cell.dataset.year, 10);
                if (!isNaN(y)) setHeaderMark({ type: 'year', year: y });
                return;
            }
            if (cell.matches('th.rank-header')) {
                const idx = Array.from(document.querySelectorAll('#rank-table-head th.rank-header')).indexOf(cell);
                if (idx >= 0) setHeaderMark({ type: 'rank', index: idx });
                return;
            }
            if (cell.matches('td.col-year')) {
                const year = parseInt(cell.textContent, 10);
                if (!isNaN(year)) setHeaderMark({ type: 'year', year });
                return;
            }
            if (cell.matches('td.col-quarter') || cell.matches('td.col-watch')) {
                const ctx = rowContextOf(cell.closest('tr'));
                if (!isNaN(ctx.year) && ctx.quarter) {
                    setHeaderMark(state.yearMode && ctx.year >= 2000 && cell.matches('td.col-watch')
                        ? { type: 'year', year: ctx.year }
                        : { type: 'quarter', year: ctx.year, quarter: ctx.quarter });
                }
            }
        }

        // 显示当前格的悬停框(作品/统计/完成率)，无对应悬停框时全部隐藏
        function showKeyNavTip(cell) {
            if (cell.matches('td.title-col') && cell.dataset.sid) {
                const icon = cell.nextElementSibling;
                if (icon && icon.classList.contains('icon-col') && icon.hasAttribute('data-tip')) { showIconTip(icon); return; }
            }
            if (cell.matches('td.col-rank')) { showStatsTip(cell); return; }
            if (cell.matches('td.col-watch') && cell.dataset.wctip) { showWatchTip(cell); return; }
            if (cell.matches('td.col-watch-h') && cell.dataset.wctip) { showWatchTip(cell); return; }
            if (cell.matches('th.rank-header, td.col-quarter, td.col-year, th.col-quarter, th.col-year')) { showStatsTip(cell); return; }
            hideIconTip(); hideStatsTip(); hideWatchTip();
        }

        function hideMouseCursor() {
            document.body.classList.add('kbnav');
        }

        function keyNavMove(dir) {
            const cur = keyNav.active;
            if (!cur || !cur.isConnected) return false;
            const next = keyNavNeighbor(cur, dir);
            if (!next || next === cur) return false;
            // 从季度格按 ← 进入年份时，记住该季度格，便于按 → 原路返回
            if (dir === 'left' && cur.matches('td.col-quarter') && next.matches('td.col-year')) {
                keyNav.yearReturn = cur;
            }
            // 横轴：从季度表头按 ↑ 进入年份表头时，记住该季度表头，便于按 ↓ 原路返回
            if (state.timeAxis === 'h' && dir === 'up'
                && cur.matches('th.col-quarter') && next.matches('th.col-year')) {
                keyNav.yearReturn = cur;
            }
            keyNav.active = next;
            applyKeyNavSelection(next);
            scrollCellIntoView(next);
            showKeyNavTip(next);
            // 滚动(若有)触发的隐藏兜底后再次显示
            setTimeout(() => { if (keyNav.active === next) showKeyNavTip(next); }, 60);
            return true;
        }

        // 清除表格内的选中/标记/键盘导航焦点(不重渲染)；Esc 与切换时间轴共用
        function clearTableSelection() {
            state.selectedSubject = null;
            state.selectedEmptyCell = null;
            state.detailView = null;
            paintSelection();
            // 三视图缓存里的旧节点也要抹掉选中/标记类，避免回来后带出残留高亮
            Object.keys(viewTableCache).forEach(k => {
                const node = viewTableCache[k] && viewTableCache[k].node;
                if (!node) return;
                node.querySelectorAll('.title-col.selected-title, .header-marked').forEach(el => el.classList.remove('selected-title', 'header-marked'));
            });
            if (headerMark) {
                headerMark = null;
                clearHeaderMarkClasses();
            }
            syncSelectedRowHighlight();
            updateSelectionBoxes();
            resetDetailView();
            keyNav.active = null;
            keyNav.yearReturn = null;
            state.selectedEmptyCell = null;
            document.body.classList.remove('kbnav');
            hideIconTip();
            hideStatsTip();
            hideWatchTip();
        }

        // 隐藏项过滤：未勾选(showXXX=false)即隐藏对应标记作品(名次截取交给名次窗口)
        function filterHiddenAnimes(rawAnimes) {
            return rawAnimes.filter(a => {
                if (!state.filters.showCompilation && a.is_compilation) return false;
                if (!state.filters.showShortMV && a.is_short_mv) return false;
                if (!state.filters.showCN && a.is_cn) return false;
                if (!state.filters.showWestern && a.is_western) return false;
                if (!state.filters.showR18 && a.is_r18) return false;
                return true;
            });
        }

        // 名次窗口：左滑块 1~50 直接显示；右滑块 2~51，显示值 = 值-1(与年份滑块同为“右滑块在左滑块右侧一格显示同值”)
        // 默认 1/21 → 窗口 1-20；基准 = 当前显示顺序(排序+隐藏过滤后)的第 N 位
        function rankRange() {
            const l = parseInt(document.getElementById('rank-min').value, 10);
            const r = parseInt(document.getElementById('rank-max').value, 10) - 1;
            return l <= r ? [l, r] : [l, l];
        }

        function rankColCount() {
            const r = rankRange();
            return r[1] - r[0] + 1;
        }

        // 未来季度判定：基线 = 数据构建季度(旧数据缺失标记时退回当前季度)，
        // 晚于基线的组为未播出占位行，前端不受过滤项目/隐藏项目影响
        function futureBaselineAbs() {
            const now = new Date();
            const curAbs = now.getFullYear() * 4 + Math.floor(now.getMonth() / 3);
            const marker = state.data ? state.data.data_abs_quarter : undefined;
            return Number.isInteger(marker) ? marker : curAbs;
        }

        function isFutureGroup(g) {
            if (g && g._isFuture !== undefined) return g._isFuture;
            const qNum = parseInt(String(g[0][1]).replace('月', ''), 10);
            return !isNaN(qNum) && g[0][0] * 4 + Math.floor((qNum - 1) / 3) > futureBaselineAbs();
        }

        // 年份模式下将单年(>=2000)各季度数据合并为一行并按当前榜单口径排序
        function mergeYearAnimes(qGroups, viewType) {
            const allFuture = qGroups.every(qg => isFutureGroup(qg));
            const seen = new Set();
            const merged = [];
            for (const qg of qGroups) {
                const qFut = isFutureGroup(qg);
                if (!allFuture && qFut && viewType === 'rank') continue;
                for (const a of qg[1] || []) {
                    const sid = String(a.subject_id);
                    if (seen.has(sid)) continue;
                    seen.add(sid);
                    if (!allFuture && viewType === 'rank' && (a.overall_rank == null || a.overall_rank >= 999999)) continue;
                    merged.push(a);
                }
            }
            if (allFuture || viewType === 'collect') {
                merged.sort((a, b) => (b.pop_count - a.pop_count) || ((a.overall_rank || 999999) - (b.overall_rank || 999999)));
            } else if (viewType === 'rating') {
                merged.sort((a, b) => ((b.score_exact != null ? b.score_exact : b.score_num) - (a.score_exact != null ? a.score_exact : a.score_num)) || ((a.overall_rank || 999999) - (b.overall_rank || 999999)));
            } else {
                merged.sort((a, b) => ((a.overall_rank || 999999) - (b.overall_rank || 999999)) || (b.pop_count - a.pop_count));
            }
            return { merged, allFuture };
        }

        function getEffectiveGroups(viewType, applyRange = true) {
            const rawGroups = state.data[viewType] || [];
            if (!state.yearMode) {
                return applyRange ? rawGroups.filter(item => groupPassesRange(item)) : rawGroups;
            }
            const source = applyRange ? rawGroups.filter(item => groupPassesRange(item)) : rawGroups;
            const result = [];
            const yearBuckets = new Map();
            for (const g of source) {
                const year = g[0][0];
                if (year < 2000) {
                    result.push(g);
                    continue;
                }
                const inRange = applyRange ? true : groupPassesRange(g);
                const key = applyRange ? year : `${year}_${inRange ? 1 : 0}`;
                let bucket = yearBuckets.get(key);
                if (!bucket) {
                    bucket = { year, inRange, groups: [] };
                    yearBuckets.set(key, bucket);
                    result.push(bucket);
                }
                bucket.groups.push(g);
            }
            return result.map(item => {
                if (Array.isArray(item)) return item;
                const { merged, allFuture } = mergeYearAnimes(item.groups, viewType);
                const group = [[item.year, '—'], merged];
                group._isFuture = allFuture;
                group._inRange = item.inRange;
                return group;
            });
        }

        // 评级排名：hotSortRank 开启时按当前显示图标权重(star9>green4>white1>red0)稳定重排，
        // 同级作品保持各视图原榜单顺序，再执行隐藏过滤与名次窗口截取；
        // 未来季度占位行不受过滤项目/隐藏项目影响，保持后端按收藏人数排好的顺序
        // (hotRank 默认跟随当前视图；搜索原因分析时按各视图自身的口径传入)
        function prepareGroupAnimes(rawAnimes, isFuture, hotRank = state.hotSortRank) {
            const r = rankRange();
            if (isFuture) return rawAnimes.slice(r[0] - 1, r[1]);
            let list = rawAnimes;
            if (hotRank) {
                list = [...rawAnimes].sort((a, b) =>
                    (ICON_WEIGHTS[animeIconKey(b)] || 0) -
                    (ICON_WEIGHTS[animeIconKey(a)] || 0));
            }
            return filterHiddenAnimes(list).slice(r[0] - 1, r[1]);
        }

        // 组是否在当前显示范围内：年份滑块、左滑块"未来"下界、右滑块顶格"未来"开关、
        // 最低位 1999 = "20世纪末"聚合行开关(渲染与搜索原因分析共用同一判断)
        function groupPassesRange(g) {
            const minYear = parseInt(document.getElementById('year-min').value);
            const year = g[0][0];
            if (year < 2000) return minYear === 1999;
            const maxSlider = document.getElementById('year-max');
            const maxYear = parseInt(maxSlider.value) - 1;
            if (isFutureGroup(g)) return parseInt(maxSlider.value, 10) >= parseInt(maxSlider.max, 10);
            if (minYear > state.currentYear) return false;
            return year >= minYear && year <= maxYear;
        }

        // 当前"隐藏项目"勾选状态下，作品命中的被隐藏类别名(用于搜索无结果提示)
        function hiddenCategoryNames(a) {
            const cats = [];
            if (a.is_compilation && !state.filters.showCompilation) cats.push('总集');
            if (a.is_short_mv && !state.filters.showShortMV) cats.push('短片');
            if (a.is_cn && !state.filters.showCN) cats.push('国产');
            if (a.is_western && !state.filters.showWestern) cats.push('欧美');
            if (a.is_r18 && !state.filters.showR18) cats.push('里番');
            return cats;
        }

        // 同步左侧榜单标签高亮与隐藏 #view-select 的当前值一致
        function syncViewSelectUI() {
            const select = document.getElementById('view-select');
            document.querySelectorAll('#left-tabs .panel-tab').forEach(function(opt) {
                opt.classList.toggle('tab-active', opt.dataset.view === select.value);
            });
        }

        // 评级选项随表格类型联动：综合排名自动开启，评分排行/热度排行默认关闭(切换表格时同步状态)
        function syncGradeByView() {
            const viewType = document.getElementById('view-select').value;
            state.hotSortRank = viewType === 'rank';
            const sw = document.getElementById('sw-resort');
            if (sw) sw.checked = state.hotSortRank;
            const lbl = document.getElementById('lbl-resort');
            if (lbl) lbl.innerText = state.hotSortRank ? '评级重排' : '评级混排';
        }

        // ==================== 表格三视图缓存 ====================
        // 每个视图缓存完整 tbody 节点，缓存键覆盖全部影响内容的输入；命中时直接换入(切换≈0ms)
        const viewTableCache = {
            rank: { node: null, key: '' },
            rating: { node: null, key: '' },
            collect: { node: null, key: '' }
        };
        // 数据整体版本：加载/同步/已看等数据变更时 +1，使所有视图缓存失效重建
        let tableEpoch = 0;
        // 重建令牌：快速连续触发渲染时，仅最新一次构建允许缓存与换入
        let tableBuildSeq = 0;

        function tableCacheKey(viewType) {
            return JSON.stringify([
                viewType, tableEpoch,
                state.sortDescending,
                state.yearMode,
                parseInt(document.getElementById('year-min').value, 10),
                parseInt(document.getElementById('year-max').value, 10),
                parseInt(document.getElementById('rank-min').value, 10),
                parseInt(document.getElementById('rank-max').value, 10),
                state.filters.showCompilation, state.filters.showShortMV,
                state.filters.showCN, state.filters.showWestern, state.filters.showR18,
                state.ratingCuts.join('|'), state.heatPct, state.heatPct2,
                state.hotSortRank, state.timeAxis
            ]);
        }

        function swapTbodyIntoTable(node) {
            const cur = document.getElementById('rank-table-body');
            if (cur !== node && cur.parentNode) {
                hideIconTip();
                hideStatsTip();
                hideWatchTip();
                cur.parentNode.replaceChild(node, cur);
            }
        }

        // 左侧榜单标题格可拖拽状态跟随右侧是否处于 补番计划表
        function syncTableDraggable() {
            const enable = rightPanelView === 'plan';
            document.querySelectorAll('#rank-table-body td.title-col[data-sid]').forEach(cell => {
                cell.setAttribute('draggable', enable ? 'true' : 'false');
            });
        }

        // 换入后(命中缓存或新建)统一恢复搜索高亮/选中/行列标记等状态
        function runTablePostActions() {
            if (window.searchState && window.searchState.isActive) {
                window.executeSearchHighlight();
                if (window.searchState.currentIndex < 0 || window.searchState.currentIndex >= window.searchState.matches.length) {
                    window.searchState.currentIndex = 0;
                }
                window.scrollToCurrentMatch();
                if (window.searchContinueJump) window.searchContinueJump();
            }
            // 详情页标记与左侧搜索完全独立：换入新表后按当前标记重新画红框
            if (state.detailMark) applyDetailMarkClasses();
            // 缓存节点可能残留旧选中，先清空再按当前状态恢复
            document.querySelectorAll('#rank-table-body td.selected-title').forEach(el => el.classList.remove('selected-title'));
            if (state.selectedSubject) {
                const cell = document.querySelector(`#rank-table-body td.title-col[data-sid="${state.selectedSubject}"]`);
                if (cell) cell.classList.add('selected-title');
            }
            paintMark();
            syncSelectedRowHighlight();
            updateSelectionBoxes();
            syncTableDraggable();
            // 详情页默认作品：首次拿到数据时设为"综合榜·当前季度第1名"
            if (!state.detailSubject) {
                const def = defaultDetailSubject();
                if (def) {
                    state.detailSubject = def;
                    if (rightPanelView === 'detail') fetchAnimeDetail(def);
                }
            }
            showSelectionTip();
        }

        // 详情页默认作品：综合榜·当前季度第1名（找不到时回退为表格第一个作品格）
        function defaultDetailSubject() {
            const abs = Number.isInteger(state.data.data_abs_quarter)
                ? state.data.data_abs_quarter : futureBaselineAbs();
            const year = Math.floor(abs / 4);
            const qLabel = ((abs % 4) * 3 + 1) + '月';
            for (const g of (state.data.rank || [])) {
                if (g[0][0] !== year || String(g[0][1]) !== qLabel) continue;
                const list = prepareGroupAnimes(g[1], isFutureGroup(g));
                if (list && list.length) return String(list[0].subject_id);
            }
            const c = document.querySelector('#rank-table-body td.title-col[data-sid]');
            return c ? c.dataset.sid : null;
        }

        // \u9aa8\u67b6\u7528\u65f6\u95f4\u5e8f\u5217\uff1a\u672a\u6765\u5b63\u5ea6(\u53f3\u6ed1\u5757\u9876\u683c) / 2000..maxYear \u9010\u5b63 / 20\u4e16\u7eaa\u672b\u805a\u5408\u6bb5\uff1b\u6309\u6392\u5e8f\u53cd\u8f6c
        // \u7eb5\u8f74\u9aa8\u67b6\u7528\u5b83\u751f\u6210\u884c\uff0c\u6a2a\u8f74\u9aa8\u67b6\u7528\u5b83\u751f\u6210\u5217(\u542b\u5168\u90e8\u5e74\u4efd)
        function skeletonTimeUnits() {
            const minEl = document.getElementById('year-min');
            const maxEl = document.getElementById('year-max');
            const minYear = parseInt(minEl.value, 10) || 2000;
            const maxSlider = parseInt(maxEl.value, 10);
            const maxYear = maxSlider - 1;
            const top = parseInt(maxEl.max, 10);
            const baseAbs = futureBaselineAbs();
            const units = [];
            if (maxSlider >= top && !state.yearMode) {
                for (let abs = baseAbs + 2; abs > baseAbs; abs--) {
                    units.push({ year: Math.floor(abs / 4), quarter: ((abs % 4) * 3 + 1) + '\u6708' });
                }
            }
            const quarters = ['10\u6708', '7\u6708', '4\u6708', '1\u6708'];
            for (let y = maxYear; y >= Math.max(2000, minYear); y--) {
                if (state.yearMode) {
                    if (y * 4 > baseAbs) continue;
                    units.push({ year: y, quarter: '\u2014' });
                    continue;
                }
                quarters.forEach((q, qi) => {
                    if (y * 4 + (3 - qi) > baseAbs) return;
                    units.push({ year: y, quarter: q });
                });
            }
            if (minYear === 1999) {
                [[1998, '1998-1999'], [1994, '1994-1997'], [1988, '1988-1993'], [1980, '1980-1987'], [1970, '1970-1979']]
                    .forEach(([y, label]) => units.push({ year: y, quarter: label, era: true }));
            }
            if (!state.sortDescending) units.reverse();
            return units;
        }

        // \u9aa8\u67b6\uff1a\u6309\u5f53\u524d\u65f6\u95f4\u8f74\u9009\u62e9\u7eb5/\u6a2a\u4e24\u5957\u6846\u67b6\uff0c\u9996\u5e27\u5373\u53ef\u771f\u5b9e\u6392\u7248
        function renderSkeleton() {
            if (state.timeAxis === 'h') { renderSkeletonH(); return; }
            const tbody = document.getElementById('rank-table-body');
            if (!tbody) return;
            const colCount = rankColCount();
            const units = skeletonTimeUnits();
            const emptyCells = '<td class="bg-gray title-col"></td><td class="bg-gray icon-col"></td>'.repeat(colCount);
            let html = '';
            for (let i = 0; i < units.length; i++) {
                const r = units[i];
                html += '<tr>';
                if (r.era) {
                    html += `<td class="col-year" colspan="2" style="font-weight: bold;">${r.quarter}</td>`;
                } else {
                    if (i === 0 || units[i - 1].era || units[i - 1].year !== r.year) {
                        let span = 1;
                        while (i + span < units.length && !units[i + span].era && units[i + span].year === r.year) span++;
                        html += `<td class="col-year" rowspan="${span}" style="font-weight: bold;">${r.year}</td>`;
                    }
                    html += `<td class="col-quarter">${r.quarter}</td>`;
                }
                html += emptyCells + cellWatchHtml({ cls: 'col-watch', empty: true }) + '</tr>';
            }
            tbody.innerHTML = html;
            lastTableRateText = '\u2014';
            updateSyncStats();
        }

        // \u6a2a\u8f74\u9aa8\u67b6\uff1a\u884c=\u540d\u6b21\uff0c\u5217=\u5b8c\u6574\u65f6\u95f4\u5e8f\u5217(\u542b\u672a\u6765\u5b63\u5ea6\u4e0e20\u4e16\u7eaa\u672b\u805a\u5408)\uff0c\u5e95\u90e8\u5b8c\u6210\u7387\u884c
        function renderSkeletonH() {
            const tbody = document.getElementById('rank-table-body');
            if (!tbody) return;
            const units = skeletonTimeUnits();
            // \u8868\u5934/\u5217\u7ec4\u6309\u5360\u4f4d\u5206\u7ec4\u6784\u5efa(\u4e0e\u771f\u5b9e\u6a2a\u8f74\u7ed3\u6784\u4e00\u81f4)
            buildTableHead(units.map(u => [[u.year, u.quarter], []]));
            const r = rankRange();
            let html = '';
            for (let rank = r[0]; rank <= r[1]; rank++) {
                const ri = rank - r[0];
                html += '<tr>';
                html += `<td class="col-rank" data-rank="${rank}" data-ri="${ri}">\u7b2c${rank}\u540d</td>`;
                units.forEach(u => {
                    html += cellEmptyPairHtml({ year: u.year, quarter: u.quarter });
                });
                html += '</tr>';
            }
            html += '<tr class="watch-row"><td class="col-rank">\u5b8c\u6210\u7387</td>';
            units.forEach(u => {
                html += cellWatchHtml({ cls: 'col-watch-h', colspan: 2, ctx: { year: u.year, quarter: u.quarter }, empty: true });
            });
            html += '</tr>';
            tbody.innerHTML = html;
            lastTableRateText = '\u2014';
            updateSyncStats();
        }

        // ===== 单元格模板：横轴/纵轴共用，避免两套模板各自演化 =====
        // ctx 传入 {year, quarter} 时输出 data-year/data-quarter(横轴需要；纵轴不输出)
        function cellAttrCtx(ctx) {
            return ctx ? ` data-year="${ctx.year}" data-quarter="${ctx.quarter}"` : '';
        }

        // 作品名格 + 评级格
        function cellPairHtml(a, tdClass, icon, isSelected, titleStyle, ctx) {
            const attrCtx = cellAttrCtx(ctx);
            const scoreText = a.score_exact != null ? fmtNum3(a.score_exact) : dash(a.score_str);
            const countText = a.score_cnt != null ? a.score_cnt : '—';
            const stdText = a.std != null ? fmtNum3(a.std) : '—';
            const recVal = a.rec_score;
            const weeklyAttr = [
                a.score_delta != null ? a.score_delta : '',
                a.pop_delta != null ? a.pop_delta : '',
                a.pop_pct != null ? a.pop_pct : '',
                a.prev_pop != null ? a.prev_pop : '',
                a.prev_score != null ? a.prev_score : ''
            ].join(',');
            return `
                        <td class="${tdClass} title-col${isSelected ? ' selected-title' : ''}" data-sid="${a.subject_id}"${attrCtx} draggable="${rightPanelView === 'plan' ? 'true' : 'false'}"
                            onclick="window.selectAnime(${a.subject_id})">
                            <span style="${titleStyle}">${a.title}</span>
                        </td>
                        <td class="${tdClass} icon-col clickable"${attrCtx} data-weekly="${weeklyAttr}" data-pcts="${a.pct_rank || ''},${a.pct_score || ''},${a.pct_cnt || ''},${a.pct_std || ''},${a.pct_pop || ''},${a.pct_rec || ''}" data-raw="${a.overall_rank >= 999999 ? '' : a.overall_rank},${a.score_exact != null ? fmtNum3(a.score_exact) : ''},${a.pop_count != null ? a.pop_count : ''},${a.score_cnt != null ? a.score_cnt : ''}" data-tip="排名: ${a.overall_rank >= 999999 ? '—' : a.overall_rank}${a.pct_rank ? ' (前' + a.pct_rank + '%)' : ''}&#10;评分: ${scoreText}${a.pct_score ? ' (前' + a.pct_score + '%)' : ''}&#10;标准差: ${stdText}${a.pct_std ? ' (前' + a.pct_std + '%)' : ''}&#10;评分数: ${countText}${a.pct_cnt ? ' (前' + a.pct_cnt + '%)' : ''}&#10;热度: ${a.pop_count}${a.pct_pop ? ' (前' + a.pct_pop + '%)' : ''}&#10;推荐度: ${recVal != null ? fmtNum3(recVal) : '—'}${a.pct_rec ? ' (前' + a.pct_rec + '%)' : ''}" onclick="window.pywebview.api.open_url('${a.url}')">
                            <span class="icon">${icon}</span>
                        </td>`;
        }

        // 空占位格(作品名 + 评级)
        function cellEmptyPairHtml(ctx) {
            const attrCtx = cellAttrCtx(ctx);
            return `<td class="bg-gray title-col"${attrCtx}></td><td class="bg-gray icon-col"${attrCtx}></td>`;
        }

        // 完成率格：o = { cls, ctx, colspan, empty, pct, wctip }
        function cellWatchHtml(o) {
            const attrCtx = cellAttrCtx(o.ctx);
            const colspan = o.colspan ? ` colspan="${o.colspan}"` : '';
            if (o.empty) return `<td class="${o.cls}"${colspan}${attrCtx}>—</td>`;
            return `<td class="${o.cls} watch-fill"${colspan}${o.wctip || ''}${attrCtx} style="--pct: ${o.pct}%;">${o.pct}%</td>`;
        }
        function renderTable() {
            keyNav.active = null;
            state.selectedEmptyCell = null; // 重渲染后旧格失效，清除键盘导航焦点
            const viewType = document.getElementById('view-select').value;
            syncViewSelectUI();
            let filteredData = getEffectiveGroups(viewType, true);
            const colCount = rankColCount();
            const colspanAll = 2 + colCount * 2 + 1;

            if (!state.sortDescending) {
                filteredData = [...filteredData].reverse();
            }
            if (state.timeAxis === 'h') {
                renderTableHorizontal(filteredData, viewType);
                return;
            }

            // 累计当前表格的加权完成率（与每行完成率列同口径，未来季度占位行按无过滤口径）
            let gTotalW = 0;
            let gWatchedW = 0;
            filteredData.forEach(g => {
                const fut = isFutureGroup(g);
                for (const a of prepareGroupAnimes(g[1], fut)) {
                    const w = ICON_WEIGHTS[animeIconKey(a)] || 0;
                    gTotalW += w;
                    if (state.watched.size > 0 && state.watched.has(a.subject_id.toString())) gWatchedW += w;
                }
            });
            lastTableRateText = state.watched.size === 0 || gTotalW === 0
                ? '—'
                : Math.round(gWatchedW / gTotalW * 100) + '%';

            const key = tableCacheKey(viewType);
            const cache = viewTableCache[viewType];
            if (cache.node && cache.key === key) {
                // 命中缓存：不做任何 DOM 重建，直接换入
                swapTbodyIntoTable(cache.node);
                runTablePostActions();
                updateSyncStats();
                return;
            }

            // 未命中：脱离文档构建新 tbody(期间旧表格保持可见)，完成后一次性换入并缓存
            const buildId = ++tableBuildSeq;
            const tbody = document.createElement('tbody');
            tbody.id = 'rank-table-body';

            function commit() {
                if (buildId !== tableBuildSeq) return;
                cache.node = tbody;
                cache.key = key;
                swapTbodyIntoTable(tbody);
                runTablePostActions();
                updateSyncStats();
            }

            if (filteredData.length === 0) {
                // 完全没有数据时保持完整表格框架；仅"筛选后为空"才显示暂无数据
                if (!((state.data[viewType] || []).length)) {
                    renderSkeleton();
                    return;
                }
                tbody.innerHTML = `<tr><td colspan="${colspanAll}" class="center-text bg-white">暂无数据</td></tr>`;
                commit();
                return;
            }

            const yearInfo = [];
            let lastYear = null;
            filteredData.forEach((g) => {
                const year = g[0][0];
                const isNewYear = year !== lastYear;
                yearInfo.push({ isNewYear, year });
                if (isNewYear) lastYear = year;
            });
            // 单遍统计每年分组数，避免逐组 filter 的 O(n²)
            const yearCounts = new Map();
            filteredData.forEach(g => yearCounts.set(g[0][0], (yearCounts.get(g[0][0]) || 0) + 1));
            for (let i = 0; i < filteredData.length; i++) {
                if (yearInfo[i].isNewYear) {
                    yearInfo[i].rowspan = yearCounts.get(yearInfo[i].year);
                }
            }
            // 行列标记预计算：行级标记(quarter/year 型)命中行 + 年份格(rowspan)是否标蓝(本年份块内任意一行被标记即标蓝)

            let chunkIndex = 0;
            const CHUNK_SIZE = 200;

            function buildChunk(start, end) {
                let html = '';
                for (let gi = start; gi < end; gi++) {
                    const seasonGroup = filteredData[gi];
                    const yearAndQuarter = seasonGroup[0];
                    const year = yearAndQuarter[0];
                    const quarter = yearAndQuarter[1];
                    const seasonFuture = isFutureGroup(seasonGroup);
                    const animes = prepareGroupAnimes(seasonGroup[1], seasonFuture);

                    if (year < 2000) {
                        // 2000 年前五年聚合行：年份+季度两列合并显示时段标签
                        html += `<tr>
                            <td class="col-year" colspan="2" style="font-weight: bold;">${quarter}</td>
                        `;
                    } else if (yearInfo[gi].isNewYear) {
                        html += `<tr>
                            <td class="col-year" rowspan="${yearInfo[gi].rowspan}" style="font-weight: bold;">${year}</td>
                            <td class="col-quarter">${quarter}</td>
                        `;
                    } else {
                        html += `<tr>
                            <td class="col-quarter">${quarter}</td>
                        `;
                    }

                    // 已看百分比：star9 green4 white1 red0 加权；权重跟随当前显示的图标
                    // (未来季度占位行不受"人数"过滤影响，用常规口径)
                    let totalW = 0;
                    let watchedW = 0;
                    const watchedKeyW = { star: 0, green: 0, white: 0, red: 0 };
                    for(let i = 0; i < colCount; i++) {
                        if(animes[i]) {
                            const anime = animes[i];
                            const iconKey = animeIconKey(anime);
                            const icon = ICONS[iconKey];
                            const isWatched = state.watched.size === 0 || state.watched.has(anime.subject_id.toString());
                            const tdClass = isWatched ? "bg-white" : "unwatched";
                            const titleStyle = isWatched ? "color: #333333;" : "color: #808080;";
                            const isSelected = anime.subject_id.toString() === state.selectedSubject;
                            // 表头/季度/排名选择标记(年份/季度/排名三列点击)，只作用于标题格，不触发详情

                            totalW += ICON_WEIGHTS[iconKey] || 0;
                            if (isWatched) {
                                watchedW += ICON_WEIGHTS[iconKey] || 0;
                                watchedKeyW[iconKey] = (watchedKeyW[iconKey] || 0) + (ICON_WEIGHTS[iconKey] || 0);
                            }

                            html += cellPairHtml(anime, tdClass, icon, isSelected, titleStyle, null);
                        } else {
                            html += cellEmptyPairHtml(null);
                        }
                    }
                    // 未同步用户数据时显示 "—" 占位，同步后按加权完成率从左到右填充已看底色
                    if (state.watched.size === 0) {
                        html += cellWatchHtml({ cls: 'col-watch', empty: true });
                    } else {
                        const pct = totalW > 0 ? Math.round(watchedW / totalW * 100) : 0;
                        // 三类标签(星/绿/白)各自对完成率的贡献(百分点)，供悬停框显示
                        const contrib = ['star', 'green', 'white'].map(k => Math.round((watchedKeyW[k] || 0) / (totalW || 1) * 100));
                        const wctip = totalW > 0 ? ` data-wctip="${contrib.join('|')}"` : '';
                        html += cellWatchHtml({ cls: 'col-watch', pct: pct, wctip: wctip });
                    }
                    html += `</tr>`;
                }
                return html;
            }

            function appendChunk() {
                const start = chunkIndex;
                const end = Math.min(chunkIndex + CHUNK_SIZE, filteredData.length);
                tbody.insertAdjacentHTML('beforeend', buildChunk(start, end));
                chunkIndex = end;
                if (chunkIndex < filteredData.length) {
                    requestAnimationFrame(appendChunk);
                } else {
                    commit();
                }
            }
            appendChunk();
        }

        // 时间横轴渲染：一行=一个名次，列=各季度(作品名+评级)，底部一行=各季度完成率
        function renderTableHorizontal(filteredData, viewType) {
            if (filteredData.length === 0) { renderSkeleton(); return; }
            buildTableHead(filteredData);

            const r = rankRange();
            const ranks = [];
            for (let i = r[0]; i <= r[1]; i++) ranks.push(i);

            // 每组作品与完成率(一次算好)
            const groupAnimes = [];
            const groupRate = [];
            let gTotalW = 0, gWatchedW = 0;
            filteredData.forEach(g => {
                const list = prepareGroupAnimes(g[1], isFutureGroup(g));
                groupAnimes.push(list);
                let tw = 0, ww = 0;
                const kw = { star: 0, green: 0, white: 0, red: 0 };
                for (const a of list) {
                    const iconKey = animeIconKey(a);
                    tw += ICON_WEIGHTS[iconKey] || 0;
                    if (state.watched.size === 0 || state.watched.has(a.subject_id.toString())) {
                        ww += ICON_WEIGHTS[iconKey] || 0;
                        kw[iconKey] = (kw[iconKey] || 0) + (ICON_WEIGHTS[iconKey] || 0);
                    }
                }
                gTotalW += tw;
                gWatchedW += ww;
                groupRate.push({ tw: tw, ww: ww, kw: kw });
            });
            lastTableRateText = state.watched.size === 0 || gTotalW === 0
                ? '—' : Math.round(gWatchedW / gTotalW * 100) + '%';

            let html = '';
            ranks.forEach((rank, ri) => {
                html += '<tr>';
                html += `<td class="col-rank" data-rank="${rank}" data-ri="${ri}">第${rank}名</td>`;
                filteredData.forEach((g, gi) => {
                    const year = g[0][0], quarter = g[0][1];
                    const a = groupAnimes[gi][ri];
                    if (a) {
                        const iconKey = animeIconKey(a);
                        const icon = ICONS[iconKey];
                        const isWatched = state.watched.size === 0 || state.watched.has(a.subject_id.toString());
                        const tdClass = isWatched ? 'bg-white' : 'unwatched';
                        const titleStyle = isWatched ? 'color: #333333;' : 'color: #808080;';
                        const isSelected = a.subject_id.toString() === state.selectedSubject;
                    html += cellPairHtml(a, tdClass, icon, isSelected, titleStyle, { year: year, quarter: quarter });
                    } else {
                        html += cellEmptyPairHtml({ year: year, quarter: quarter });
                    }
                });
                html += '</tr>';
            });
            // 完成率行(底部)：每季度一格，跨 2 列
            html += '<tr class="watch-row"><td class="col-rank">完成率</td>';
            filteredData.forEach((g, gi) => {
                const year = g[0][0], quarter = g[0][1];
                if (state.watched.size === 0) {
                    html += cellWatchHtml({ cls: 'col-watch-h', colspan: 2, ctx: { year: year, quarter: quarter }, empty: true });
                } else {
                    const rate = groupRate[gi];
                    const pct = rate.tw > 0 ? Math.round(rate.ww / rate.tw * 100) : 0;
                    const contrib = ['star', 'green', 'white'].map(k => Math.round((rate.kw[k] || 0) / (rate.tw || 1) * 100));
                    const wctip = rate.tw > 0 ? ` data-wctip="${contrib.join('|')}"` : '';
                    html += cellWatchHtml({ cls: 'col-watch-h', colspan: 2, ctx: { year: year, quarter: quarter }, pct: pct, wctip: wctip });
                }
            });
            html += '</tr>';

            const buildId = ++tableBuildSeq;
            const tbody = document.createElement('tbody');
            tbody.id = 'rank-table-body';
            tbody.innerHTML = html;
            if (buildId !== tableBuildSeq) return;
            const cache = viewTableCache[viewType];
            cache.node = tbody;
            cache.key = tableCacheKey(viewType);
            swapTbodyIntoTable(tbody);
            runTablePostActions();
            updateSyncStats();
        }

        // 更新顶栏统计：已看=同步抓取总数，追更=排期表点亮+手动添加卡片数，
        // 完成率=当前表格加权完成率，数据日期=最新下载归档包日期(YYYYMMDD)
        function updateSyncStats() {
            const watchedCount = state.watched.size;
            const followingCount = state.data.broadcast.filter(a =>
                state.watched.has(a.id.toString()) || a.is_manual).length;
            document.getElementById('sync-stats').innerText =
                `已看 ${watchedCount} 部 · 追更 ${followingCount} 部 · 表格完成率 ${lastTableRateText} · 数据日期 ${state.dataDate || '—'}`;
        }

        // 读取后端最新归档日期（失败时保留当前值）
        async function refreshDataDate() {
            try {
                const resp = await api.getDataDate();
                if (resp && !resp.error) state.dataDate = resp.date || '';
            } catch (e) {}
            updateSyncStats();
        }

        // 被折叠的周几(1~7)，本次运行内存中保存
        const collapsedDays = new Set();

        // 点击周几卡片：折叠/展开当天新番卡片(直接改 DOM，不整表重渲染)
        function toggleWeekdayCollapse(day, cardEl) {
            day = Number(day);
            const group = cardEl.closest('.weekday-group');
            if (!group) return;
            if (collapsedDays.has(day)) collapsedDays.delete(day);
            else collapsedDays.add(day);
            const collapsed = collapsedDays.has(day);
            const grid = group.querySelector('.cards-grid');
            // 展开时边框为绿色(同新番卡片)，折叠时边框为手动卡片样式
            cardEl.classList.toggle('border-green', !collapsed);
            cardEl.classList.toggle('border-manual', collapsed);
            if (grid) grid.style.display = collapsed ? 'none' : '';
        }

        function renderBroadcast() {
            const broadcastList = document.getElementById('broadcast-list');
            const daysMap = {1:"周一", 2:"周二", 3:"周三", 4:"周四", 5:"周五", 6:"周六", 7:"周日"};
            const today = new Date().getDay() || 7;
            const yesterday = today === 1 ? 7 : today - 1;

            const dayOrder = [];
            for(let i = 0; i < 7; i++) {
                dayOrder.push(((yesterday - 1 + i) % 7) + 1);
            }

            let scheduleHtml = '';

            dayOrder.forEach(day => {
                let dayAnimes = state.data.broadcast.filter(a => a.weekday === day);
                dayAnimes.forEach(a => {
                    a.isWatched = state.watched.has(a.id.toString());
                });

                if (state.hideUnwatched) {
                    dayAnimes = dayAnimes.filter(a => a.isWatched || a.is_manual);
                }

                dayAnimes.sort((a, b) => {
                    const aPrior = (a.isWatched || a.is_manual) ? 0 : 1;
                    const bPrior = (b.isWatched || b.is_manual) ? 0 : 1;
                    if (aPrior !== bPrior) return aPrior - bPrior;
                    const timeA = a.sort_time || "23:59";
                    const timeB = b.sort_time || "23:59";
                    if (timeA !== timeB) return timeA.localeCompare(timeB);
                    return 0;
                });

                // 周几卡片常驻显示(即使当天卡片被过滤/折叠为空)，点击可折叠/展开当天卡片
                const collapsed = collapsedDays.has(day);
                const todayTag = day === today ? " (今日)" : (day === yesterday ? " (昨日)" : "");
                scheduleHtml += `
                <div class="weekday-group">
                    <div class="weekday-card ${collapsed ? 'border-manual' : 'border-green'}" onclick="window.toggleWeekdayCollapse(${day}, this)">
                        <h3 class="weekday-title">${daysMap[day]}${todayTag}</h3>
                    </div>`;

                if (dayAnimes.length > 0) {
                    scheduleHtml += `<div class="cards-grid"${collapsed ? ' style="display: none;"' : ''}>`;
                }

                dayAnimes.forEach(anime => {
                    let percentage = 0;
                    if (anime.total > 0) percentage = Math.min(100, (anime.aired / anime.total) * 100);
                    let cardBorder;
                    if (anime.is_manual) {
                        cardBorder = "border-manual";
                    } else {
                        cardBorder = (anime.isWatched || anime.is_manual) ? "border-green" : "border-gray";
                    }
                    const bgmUrl = `https://bgm.tv/subject/${anime.id.toString().replace('manual_','')}`;
                    const biliUrl = `https://search.bilibili.com/all?keyword=${encodeURIComponent(anime.title)}`;

                    scheduleHtml += `
                    <div class="card ${cardBorder}" style="cursor: pointer;">
                        <div class="card-top">
                            <span class="card-title">${anime.title}</span>
                            <div class="badges">
                                <button class="badge-bili" onclick="event.stopPropagation(); window.pywebview.api.open_url('${biliUrl}')">Bilibili</button>
                                <button class="badge-bgm" onclick="event.stopPropagation(); window.pywebview.api.open_url('${bgmUrl}')">Bgm</button>
                            </div>
                        </div>
                        <div class="card-info">首播: ${dash(anime.air_date)} | <span class="update-time" ondblclick="window.editUpdateTime(event, '${anime.id}')" title="双击修改时间">更新: ${dash(anime.update_time)}</span></div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%;"></div>
                            <span class="progress-text">已更 ${anime.aired}/${anime.total} 集</span>
                        </div>
                    </div>`;
                });

                if (dayAnimes.length > 0) {
                    scheduleHtml += `</div>`;
                }
                scheduleHtml += `</div>`;
            });

            if (scheduleHtml === '') {
                const noData = !(state.data.broadcast && state.data.broadcast.length);
                scheduleHtml = `<p class="center-text" style="color: #b3b3b3; margin-top: 30px;">${noData ? '暂无数据' : '当前过滤条件下没有番剧'}</p>`;
            }

            broadcastList.innerHTML = scheduleHtml;
            updateSyncStats();
        }

        // ==================== 补番计划表 ====================
        // 横栏：0 正在补 / 1 计划补 / 2 排除项
        const PLAN_SECTIONS = { 0: '正在补', 1: '计划补', 2: '排除项' };
        // 横栏折叠状态(排除项默认折叠)，本次运行内存中保存
        const planCollapsed = { 0: false, 1: false, 2: true };

        function getPlanEntries() {
            if (!state.data.plan) state.data.plan = [];
            return state.data.plan;
        }

        function savePlanData() {
            try { api.savePlanData(state.data.plan || []); } catch {}
        }

        // 在榜单条目中查找作品元数据(评分/热度/总排名/推荐分等)
        function planMetaOf(sid) {
            sid = String(sid);
            for (const key of ['rank', 'rating', 'collect']) {
                const groups = state.data[key];
                if (!groups) continue;
                for (const g of groups) {
                    for (const a of g[1]) {
                        if (String(a.subject_id) === sid) return a;
                    }
                }
            }
            return null;
        }

        // 同推荐分时总排名更高的(overall_rank 更小)排在前面
        function comparePlan(a, b) {
            const ma = planMetaOf(a.sid);
            const mb = planMetaOf(b.sid);
            const ra = ma && ma.rec_score != null ? ma.rec_score : -Infinity;
            const rb = mb && mb.rec_score != null ? mb.rec_score : -Infinity;
            if (ra !== rb) return rb - ra;
            const ka = ma ? (ma.overall_rank || 999999) : 999999;
            const kb = mb ? (mb.overall_rank || 999999) : 999999;
            if (ka !== kb) return ka - kb;
            return String(a.sid).localeCompare(String(b.sid));
        }

        function planCardHtml(entry) {
            const meta = planMetaOf(entry.sid);
            const brief = (getDetailAnimeMap() || {})[entry.sid];
            const title = meta ? meta.title : (brief ? brief.title : '—');
            const dateStr = brief ? brief.date : '';
            const dateText = dateStr && dateStr.length >= 7 ? dateStr.slice(0, 7) : '—';
            const rank = meta ? (meta.overall_rank || 999999) : (brief && brief.rank ? brief.rank : 999999);
            const recText = meta && meta.rec_score != null ? meta.rec_score : '—';
            const scoreStr = meta && meta.score_str ? meta.score_str : (brief && brief.score ? brief.score : '—');
            const heatNum = meta && meta.pop_count != null ? meta.pop_count
                : (brief && brief.pop_count != null ? brief.pop_count : null);
            const heatText = heatNum != null ? heatNum : '—';
            const rawScore = String(scoreStr);
            const scoreText = (rawScore === '—' || rawScore === 'N/A') ? '—' : rawScore + '分';
            const rankText = rank >= 999999 ? '—' : rank + '名';
            const border = entry.section === 2 ? 'border-manual' : 'border-green';
            const bgmUrl = `https://bgm.tv/subject/${entry.sid.replace('manual_', '')}`;
            const biliUrl = `https://search.bilibili.com/all?keyword=${encodeURIComponent(title)}`;
            return `
            <div class="card plan-card ${border}" data-sid="${esc(entry.sid)}"
                 draggable="true"
                 ondragstart="window.planCardDragStart(event, '${esc(entry.sid)}')"
                 ondblclick="window.removePlanCard('${esc(entry.sid)}')">
                <div class="card-top">
                    <span class="card-title">${esc(title)}</span>
                    <div class="badges">
                        <button class="badge-bili" onclick="event.stopPropagation(); window.pywebview.api.open_url('${biliUrl}')">Bilibili</button>
                        <button class="badge-bgm" onclick="event.stopPropagation(); window.pywebview.api.open_url('${bgmUrl}')">Bgm</button>
                    </div>
                </div>
                <div class="card-info plan-info-date">首播: ${esc(dateText)} | ${rankText} | ${esc(scoreText)}</div>
                <div class="card-info plan-info-rank">热度: ${heatText} | 推荐度: ${recText}</div>
            </div>`;
        }

        /* 各横栏固定按 推荐分降序 / 总排名升序 展示 */
        function renderPlan() {
            const listEl = document.getElementById('plan-list');
            const entries = getPlanEntries();
            const noEntries = entries.length === 0;
            let html = '';
            for (const sec of [0, 1, 2]) {
                const items = entries.filter(e => e.section === sec).sort(comparePlan);
                const collapsed = !!planCollapsed[sec];
                html += `
                <div class="weekday-group">
                    <div class="weekday-card plan-section ${collapsed ? 'border-manual' : 'border-green'}" data-section="${sec}" draggable="true"
                         onclick="window.togglePlanSection(${sec})" ondragstart="window.planSectionDragStart(event, ${sec})">
                        <h3 class="weekday-title">${PLAN_SECTIONS[sec]}</h3>
                    </div>`;
                if (items.length === 0) {
                    // 空横栏下保留一行卡片高度的空间；提示文字写在第一个横栏(正在补)下方
                    html += `<div class="plan-empty-row">`;
                    if (noEntries && sec === 0) {
                        html += `<div class="detail-empty">请从左侧表格拖入作品</div>`;
                    }
                    html += `</div>`;
                } else {
                    html += `<div class="cards-grid plan-cards"${collapsed ? ' style="display: none;"' : ''}>` + items.map(planCardHtml).join('') + `</div>`;
                }
                html += `</div>`;
            }
            listEl.innerHTML = html;
        }

        function togglePlanSection(sec) {
            sec = Number(sec);
            planCollapsed[sec] = !planCollapsed[sec];
            renderPlan();
        }

        // 添加(或移动)作品到指定横栏；已存在则仅切换横栏
        function addPlanEntry(sid, section) {
            sid = String(sid);
            section = Number(section);
            const entries = getPlanEntries();
            const exist = entries.find(e => String(e.sid) === sid);
            if (exist) {
                if (exist.section !== section) {
                    exist.section = section;
                    savePlanData();
                    renderPlan();
                }
                return;
            }
            entries.push({ sid: sid, section: section });
            savePlanData();
            renderPlan();
        }

        function removePlanCard(sid) {
            sid = String(sid);
            state.data.plan = getPlanEntries().filter(e => String(e.sid) !== sid);
            savePlanData();
            renderPlan();
        }

        // 从当前未看、不在补番计划表里的作品中按推荐分从高到低取前 count 部加入 计划补
        function recommendPlanAnimes(count) {
            count = Number(count) || 1;
            const entries = getPlanEntries();
            const inPlan = new Set(entries.map(e => String(e.sid)));
            const hasWatched = state.watched.size > 0;
            const seen = new Set();
            const cands = [];
            for (const key of ['rank', 'rating', 'collect']) {
                const groups = state.data[key] || [];
                for (const g of groups) {
                    for (const a of g[1]) {
                        const sid = String(a.subject_id);
                        if (seen.has(sid)) continue;
                        seen.add(sid);
                        if (a.rec_score == null) continue;
                        // 仅跳过当前处于隐藏状态的类别(勾选“隐藏项目”显示后即可参与推荐)
                        if ((!state.filters.showCompilation && a.is_compilation) ||
                            (!state.filters.showShortMV && a.is_short_mv) ||
                            (!state.filters.showCN && a.is_cn) ||
                            (!state.filters.showWestern && a.is_western) ||
                            (!state.filters.showR18 && a.is_r18)) continue;
                        if (hasWatched && state.watched.has(sid)) continue;
                        if (inPlan.has(sid)) continue;
                        cands.push(a);
                    }
                }
            }
            cands.sort((x, y) =>
                (y.rec_score - x.rec_score) ||
                ((x.overall_rank || 999999) - (y.overall_rank || 999999)) ||
                (Number(x.subject_id) - Number(y.subject_id)));
            let added = 0;
            for (const a of cands.slice(0, count)) {
                entries.push({ sid: String(a.subject_id), section: 1 });
                added++;
            }
            if (added) {
                savePlanData();
                renderPlan();
            }
            return added;
        }

        // 输入框搜索添加(调用后端搜索并返回作品信息)
        async function addPlanBySearch() {
            const input = document.getElementById('plan-input');
            const keyword = input.value.trim();
            if (!keyword) return;
            const btn = document.getElementById('plan-add-btn');
            btn.disabled = true;
            btn.innerText = '搜索中...';
            try {
                const resp = await api.searchAndAddAnime(keyword);
                if (resp.error) {
                    alert('添加失败：' + resp.error);
                } else {
                    const rawId = resp.anime.id.toString().replace('manual_', '');
                    if (getPlanEntries().some(e => String(e.sid) === rawId)) {
                        alert('该作品已在补番计划表中');
                        return;
                    }
                    addPlanEntry(rawId, 1);
                    input.value = '';
                }
            } catch (err) {
                alert('发生异常：' + err);
            } finally {
                btn.disabled = false;
                btn.innerText = '添加';
            }
        }

        // ==================== 拖拽 ====================
        // 补番卡片拖起：标记来源为补番计划表
        function planCardDragStart(ev, sid) {
            sid = String(sid);
            ev.dataTransfer.setData('text/x-plan', sid);
            ev.dataTransfer.setData('text/plain', sid);
            ev.dataTransfer.effectAllowed = 'move';
        }

        // 拖拽快照残留节点：离屏 fixed 克隆，不影响任何可见布局
        let dndGhostNode = null;

        function removeDndGhost() {
            if (dndGhostNode && dndGhostNode.isConnected) dndGhostNode.remove();
            dndGhostNode = null;
        }

        // 左侧榜单作品拖起：仅当右侧为 补番计划表 时才允许。
        // 拖拽图 = 原格的离屏克隆(无边框、固定宽高、fixed 定位不参与布局)：源单元格外观完全不变，也不引起右侧 UI 抖动
        function handleTableDragStart(ev) {
            const td = ev.target.closest('td.title-col');
            if (!td || !td.dataset.sid) return;
            if (rightPanelView !== 'plan') {
                ev.preventDefault();
                return;
            }
            ev.dataTransfer.setData('text/plain', td.dataset.sid);
            ev.dataTransfer.effectAllowed = 'copy';
            const rect = td.getBoundingClientRect();
            removeDndGhost();
            const ghost = td.cloneNode(true);
            ghost.style.cssText = 'box-shadow: none !important; pointer-events: none;';
            ghost.style.width = rect.width + 'px';
            ghost.style.height = rect.height + 'px';
            const wrap = document.createElement('table');
            wrap.style.cssText = 'table-layout: fixed; border-collapse: collapse; border-spacing: 0; width: ' + rect.width + 'px;' +
                ' position: fixed; left: -10000px; top: 0; pointer-events: none;';
            const tr = document.createElement('tr');
            tr.appendChild(ghost);
            wrap.appendChild(tr);
            document.body.appendChild(wrap);
            dndGhostNode = wrap;
            ev.dataTransfer.setDragImage(wrap, ev.clientX - rect.left, ev.clientY - rect.top);
            const cleanup = function() {
                removeDndGhost();
                td.removeEventListener('dragend', cleanup);
            };
            td.addEventListener('dragend', cleanup);
            // 兜底：异常中断拖拽(如窗口失焦)时也清理残留
            setTimeout(function() {
                if (dndGhostNode === wrap) removeDndGhost();
            }, 10000);
        }

        function handlePlanDragOver(ev) {
            if (ev.target.closest('#plan-list')) ev.preventDefault();
        }

        // 放入补番计划表：落到哪个横栏区域就按来源处理(卡片换栏/横栏整组移动/榜单作品加入)
        function handlePlanDrop(ev) {
            if (!ev.target.closest('#plan-list')) return;
            ev.preventDefault();
            const group = ev.target.closest('.weekday-group');
            const header = group ? group.querySelector('.plan-section') : null;
            const section = header ? Number(header.dataset.section) : 1;
            const types = ev.dataTransfer.types;
            const isPlanCard = types.indexOf('text/x-plan') >= 0;
            const isPlanSection = types.indexOf('text/x-plan-section') >= 0;
            if (isPlanCard) {
                const sid = String(ev.dataTransfer.getData('text/x-plan') || '');
                if (sid) addPlanEntry(sid, section);
                return;
            }
            if (isPlanSection) {
                // 拖动横栏到另一横栏：整组换栏
                const srcSec = Number(ev.dataTransfer.getData('text/x-plan-section'));
                if (!isNaN(srcSec) && srcSec !== section) {
                    const entries = getPlanEntries();
                    entries.forEach(e => {
                        if (e.section === srcSec) e.section = section;
                    });
                    savePlanData();
                    renderPlan();
                }
                return;
            }
            const sid = String(ev.dataTransfer.getData('text/plain') || '');
            if (!sid) return;
            // 已看过的作品从榜单拖入时不添加
            if (state.watched.size > 0 && state.watched.has(sid)) return;
            addPlanEntry(sid, section);
        }

        // 横栏拖起：整个横栏的作品可整体换组或拖到左侧表格整组删除
        function planSectionDragStart(ev, sec) {
            sec = String(sec);
            ev.dataTransfer.setData('text/x-plan-section', sec);
            ev.dataTransfer.setData('text/plain', sec);
            ev.dataTransfer.effectAllowed = 'move';
        }

        // 左侧表格作为删除区：补番卡片拖入即删除该卡片
        function handleTableDragOver(ev) {
            const types = ev.dataTransfer.types;
            if (types.indexOf('text/x-plan') >= 0 || types.indexOf('text/x-plan-section') >= 0) {
                ev.preventDefault();
            }
        }

        function handleTableDrop(ev) {
            const types = ev.dataTransfer.types;
            const cardSid = ev.dataTransfer.getData('text/x-plan');
            const secRaw = ev.dataTransfer.getData('text/x-plan-section');
            if (!cardSid && !secRaw) return;
            ev.preventDefault();
            if (cardSid) {
                removePlanCard(cardSid);
            } else {
                // 横栏拖入左侧表格：删除该横栏下的全部作品
                const sec = Number(secRaw);
                state.data.plan = getPlanEntries().filter(e => e.section !== sec);
                savePlanData();
                renderPlan();
            }
        }

        // ==================== 详情面板 ====================
        // 缺失数据统一显示 —：空值及历史占位(未知/N/A/- 等)一律归一
        function dash(v) {
            if (v === null || v === undefined) return '—';
            const s = String(v).trim();
            if (s === '' || s === '-' || s === 'N/A' || s === '未知' ||
                s === '未知作品' || s === '未知人物' || s === '未知角色') return '—';
            return s;
        }

        // 两位小数按“始终三位数字”显示：整数部分≥10 保留 1 位，否则保留 2 位
        // (如 10.00 → 10.0、8.5 → 8.50、7.89 → 7.89)
        function fmtNum3(v) {
            const n = Number(v);
            if (!isFinite(n)) return '—';
            return Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(2);
        }

        function esc(s) {
            return String(s ?? '')
                .replace(/&(?!amp;|lt;|gt;|quot;|#39;)/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function formatYM(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            if (parts.length >= 2) return `${parts[0]}-${parts[1]}`;
            return dateStr;
        }

        function getDetailAnimeMap() {
            return (state.detail && state.detail.anime) ? state.detail.anime : null;
        }

        function getSelectedAnime() {
            const map = getDetailAnimeMap();
            if (!map || !state.detailSubject) return null;
            return map[state.detailSubject] || null;
        }

        function getPersonName(pid) {
            return (state.detail && state.detail.persons && state.detail.persons[pid]) || '—';
        }

        function getCharacterName(cid) {
            return (state.detail && state.detail.characters && state.detail.characters[cid]) || '—';
        }

        // 选中作品时，同步高亮同行的季度/年份标签/完成率单元格与同列的“第N名”表头
        function syncSelectedRowHighlight() {
            document.querySelectorAll('#rank-table-body td.col-year.selected-year').forEach(el => el.classList.remove('selected-year'));
            document.querySelectorAll('#rank-table-body td.col-quarter.selected-quarter').forEach(el => el.classList.remove('selected-quarter'));
            document.querySelectorAll('#rank-table-head th.rank-header.selected-rank').forEach(el => el.classList.remove('selected-rank'));
            document.querySelectorAll('#rank-table-body td.col-watch.selected-watch').forEach(el => el.classList.remove('selected-watch'));
            const cell = document.querySelector('#rank-table-body td.title-col.selected-title');
            if (!cell) return;
            // 同一行的季度/年份标签与完成率格(2000 年前聚合行无季度格，其年份合并格代替高亮)
            const row = cell.closest('tr');
            if (row) {
                const q = row.querySelector('td.col-quarter');
                const w = row.querySelector('td.col-watch');
                if (q && !state.yearMode) {
                    q.classList.add('selected-quarter');
                } else {
                    const y = row.querySelector('td.col-year');
                    if (y) y.classList.add('selected-year');
                }
                if (w) w.classList.add('selected-watch');
            }
            // 同一列的第N名表头（按行内标题格顺序换算 0~19，与年份单元格有无无关）
            const titlesInRow = row.querySelectorAll('td.title-col');
            const rankPos = Array.from(titlesInRow).indexOf(cell);
            if (rankPos >= 0) {
                const ths = document.querySelectorAll('#rank-table-head th.rank-header');
                if (ths[rankPos]) ths[rankPos].classList.add('selected-rank');
            }
        }

        // 粘性元素层级随选中类型提升(+3)：作品→四类全抬；年/季/完成率→名次抬；名次→年/季/完成率抬
        // 粘性元素层级提升入口：kind = 'work' | 'yq' | 'rank' | null
        function setStickyBoost(kind) {
            const b = document.body.classList;
            b.toggle('sel-work', kind === 'work');
            b.toggle('sel-yq', kind === 'yq');
            b.toggle('sel-rank', kind === 'rank');
        }

        // 选中显示模式：层级由当前选中/标记决定；悬停显示模式不受选中影响
        function updateStickyLayers() {
            if (!tipPinned()) return;
            let kind = null;
            if (state.selectedSubject) kind = 'work';
            else if (headerMark) kind = (headerMark.type === 'rank') ? 'rank' : 'yq';
            setStickyBoost(kind);
        }

        // 悬停显示模式：按悬停格决定层级；不会弹面板的格子不提升
        function hoverBoostKind(cell) {
            if (!cell) return null;
            if (cell.matches('td.title-col, td.icon-col')) {
                const icon = cell.matches('td.icon-col') ? cell : cell.nextElementSibling;
                return (icon && icon.classList.contains('icon-col') && icon.hasAttribute('data-tip')) ? 'work' : null;
            }
            if (cell.matches('th.rank-header, td.col-rank')) {
                return statsCellsOf(cell).length ? 'rank' : null;
            }
            if (cell.matches('td.col-watch, td.col-watch-h')) {
                return cell.dataset.wctip ? 'yq' : null;
            }
            if (cell.matches('th.col-year, th.col-quarter, th.col-watch, td.col-year, td.col-quarter')) {
                if (cell.matches('td.col-quarter, th.col-quarter') && cell.textContent.trim() === '—') return null;
                return statsCellsOf(cell).length ? 'yq' : null;
            }
            return null;
        }

        // 选中态投影到 DOM：只根据 state(selectedSubject / selectedEmptyCell) 维护 .selected-title，
        // 避免各处手写"先全部移除再加一个"，也避免用 CSS 类充当状态
        function paintSelection() {
            const want = state.selectedSubject
                ? document.querySelector(`#rank-table-body td.title-col[data-sid="${state.selectedSubject}"]`)
                : (state.selectedEmptyCell && state.selectedEmptyCell.isConnected ? state.selectedEmptyCell : null);
            document.querySelectorAll('#rank-table-body .title-col.selected-title').forEach(el => {
                if (el !== want) el.classList.remove('selected-title');
            });
            if (want) want.classList.add('selected-title');
            updateStickyLayers();
        }

        async function selectAnime(subjectId) {
            subjectId = subjectId.toString();
            state.selectedEmptyCell = null;
            // 互斥：选中单格时清除行列标记(含年份/季度/完成率格及表头的标蓝)
            if (headerMark) {
                headerMark = null;
                clearHeaderMarkClasses();
            }
            // 重复点击当前已选中的同一作品：只取消选中与高亮，详情页继续显示该作品(上一次选中)
            if (state.selectedSubject === subjectId) {
                state.selectedSubject = null;
                paintSelection();
                syncSelectedRowHighlight();
                updateSelectionBoxes();
                showSelectionTip();
                return;
            }
            state.selectedSubject = subjectId;
            state.detailSubject = subjectId;
            state.detailView = null;
            state.expandedStaffGroups = new Set();
            // 切换作品：清空详情页人物搜索/当前人物，但保留已标记的关联作品红框
            resetDetailPersonState(false);
            showDetailListTab(state.detailSearchScope);
            // 高亮移动：按 state 重新投影选中类
            paintSelection();
            syncSelectedRowHighlight();
            updateSelectionBoxes();
            showSelectionTip();
            // 需求：未切换到作品详情页时不加载详情数据，切换后再加载
            if (rightPanelView !== 'detail') return;
            await fetchAnimeDetail(subjectId);
        }

        // 选中空占位格(无 data-sid)：与作品选中一样画四个框(作品对/行或列格/完成率格/名次表头)，
        // 只是不加载详情、不显示悬停面板
        function selectEmptyCell(cell) {
            if (!cell || !cell.classList.contains('title-col') || cell.dataset.sid) return;
            // 重复点击已选中的同一个空格：取消选中
            if (cell.classList.contains('selected-title')) {
                state.selectedSubject = null;
                state.selectedEmptyCell = null;
                paintSelection();
                syncSelectedRowHighlight();
                updateSelectionBoxes();
                showSelectionTip();
                return;
            }
            state.selectedSubject = null;
            if (headerMark) { headerMark = null; clearHeaderMarkClasses(); }
            state.selectedEmptyCell = cell;
            paintSelection();
            syncSelectedRowHighlight();
            updateSelectionBoxes();
            showSelectionTip();
        }

        // 拉取并渲染单个作品的完整详情(detail_main：作品主体+相关人物/角色名)
        async function fetchAnimeDetail(subjectId) {
            subjectId = subjectId.toString();
            const seq = ++detailRequestSeq;
            if (detailFetchedSubjects.has(subjectId)) {
                renderDetail();
                return;
            }

            const brief = state.detail.anime[subjectId];
            document.getElementById('detail-intro-label').innerText = (brief && brief.title) || '加载中...';
            document.getElementById('detail-intro-back').style.display = 'none';
            document.getElementById('detail-staff').innerHTML = '<div class="detail-empty">加载中...</div>';
            document.getElementById('detail-cast').innerHTML = '<div class="detail-empty">加载中...</div>';
            document.getElementById('detail-intro').innerHTML = '<div class="detail-empty">加载中...</div>';

            const resp = await api.getAnimeDetail(subjectId);
            if (resp && resp.success) {
                detailFetchedSubjects.add(subjectId);
                // 将拉取到的完整作品数据与相关人物/角色名合并到内存库(履历按人另行拉取)
                if (resp.anime) {
                    state.detail.anime[subjectId] = Object.assign(
                        state.detail.anime[subjectId] || {}, resp.anime);
                }
                Object.assign(state.detail.persons, resp.persons);
                Object.assign(state.detail.characters, resp.characters);
                if (seq === detailRequestSeq) renderDetail();
            } else if (seq === detailRequestSeq) {
                document.getElementById('detail-staff').innerHTML = '';
                document.getElementById('detail-cast').innerHTML = '';
                document.getElementById('detail-intro').innerHTML = '';
            }
        }

        function renderDetail() {
            const anime = getSelectedAnime();
            renderDetailSections();
            renderDetailIntro();
        }

        // 当前表格的总完成率文本（renderTable 按当前视图/年份/热度过滤累计后更新）
        let lastTableRateText = '—';

        // 右侧面板三种视图：新番时间表 / 补番计划表 / 作品详情页，由右侧标题栏标签页切换
        const RIGHT_VIEWS = { schedule: '新番时间表', plan: '补番计划表', detail: '作品详情页' };
        let rightPanelView = 'schedule';
        // 履历文件空闲预读只触发一次
        let detailCareersPrefetched = false;

        // 标签组激活态：按 dataset 字段匹配，避免各处重复写 forEach + classList.toggle
        function markActiveTab(selector, dataKey, value, activeClass) {
            document.querySelectorAll(selector).forEach(el => {
                el.classList.toggle(activeClass, el.dataset[dataKey] === value);
            });
        }

        function setRightPanelView(view) {
            if (!(view in RIGHT_VIEWS)) view = 'schedule';
            rightPanelView = view;
            Object.keys(RIGHT_VIEWS).forEach(key => {
                document.getElementById(key + '-view').style.display = key === view ? 'flex' : 'none';
            });
            markActiveTab('#right-tabs .panel-tab', 'view', view, 'tab-active');
            // 首次进入作品详情页：解析 detail_main(作品主体)；随后空闲预读履历文件 detail_extra
            if (view === 'detail') {
                try { api.preloadDetailData(); } catch {}
                if (!detailCareersPrefetched) {
                    detailCareersPrefetched = true;
                    setTimeout(function() {
                        try { api.preloadDetailCareers(); } catch {}
                    }, 600);
                }
                // 详情页未开启期间展示的作品未拉取过：此时补拉取并渲染
                if (state.detailSubject && !detailFetchedSubjects.has(state.detailSubject)) {
                    fetchAnimeDetail(state.detailSubject);
                }
            }
            // 仅当右侧为 补番计划表 时，左侧榜单标题才允许拖动
            syncTableDraggable();
            // 详情页变为可见后，用真实宽度重新渲染（隐藏时 clientWidth 为 0 会导致制作人员误截断）
