        // 取本地数据：后端把数据文件原始字节 + 已看列表压缩成 deflate+base64 传输，
        // 经 js_api 桥体积更小、启动更快；这里解压还原。解压不可用时回退未压缩接口。
        async function fetchLocalData() {
            let response;
            try {
                response = await api.getLocalData();
            } catch (e) {
                return { error: String(e) };
            }
            if (!response) return { error: '未知错误' };
            if (response.error) return response;
            if (!response.deflate_base64) return response;
            try {
                return normalizeLocalPayload(await inflateBase64Json(response.deflate_base64));
            } catch (e) {
                try {
                    return await api.getLocalDataRaw();
                } catch (e2) {
                    return { error: String(e2) };
                }
            }
        }

        // base64 -> 字节 -> DecompressionStream('deflate') -> JSON
        function inflateBase64Json(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
            return new Response(stream).json();
        }

        // 解压得到 { l: 原始 local_data, w: 已看列表 }，转成前端使用的 { data, watched, anime_map }
        function normalizeLocalPayload(p) {
            if (p && p.l) {
                const data = {};
                for (const k in p.l) { if (k !== 'anime_brief') data[k] = p.l[k]; }
                return { data: data, watched: p.w || [], anime_map: p.l.anime_brief || {} };
            }
            return p || { error: '未知错误' };
        }

        async function loadRealData() {
            const broadcastList = document.getElementById('broadcast-list');
            // 启动即画出完整表格骨架(列结构 + 年份/季度/名次行)，作品/评级/完成率留空待数据到达
            renderSkeleton();
            // 补番计划表三栏(正在补/计划补/排除项)也先画出来，无数据时仍显示完整横栏
            renderPlan();
            broadcastList.innerHTML = '<p class="center-text">正在加载排期...</p>';

            const response = await fetchLocalData();
            if (response.error) {
                // 无数据时保留完整表格框架；右侧只显示"暂无数据"
                renderSkeleton();
                try { console.error('本地数据加载失败:', response.error); } catch (e) {}
                renderBroadcast();
                return;
            }

            state.data.rank = response.data.rank || [];
            state.data.rating = response.data.rating || [];
            state.data.collect = response.data.collect || [];
            state.data.broadcast = response.data.broadcast || [];
            state.data.plan = response.data.plan || [];
            state.data.data_abs_quarter = response.data.data_abs_quarter;
            // 同评分按总排名更高(overall_rank 更小)者靠前；同热度同理；旧数据无需重新更新也生效
            // 未来季度占位行跳过重排：三榜统一保持后端按收藏人数排好的顺序
            state.data.rating.forEach(g => { if (!isFutureGroup(g)) g[1].sort((a, b) => ((b.score_exact != null ? b.score_exact : b.score_num) - (a.score_exact != null ? a.score_exact : a.score_num)) || (a.overall_rank - b.overall_rank)); });
            state.data.collect.forEach(g => { if (!isFutureGroup(g)) g[1].sort((a, b) => (b.pop_count - a.pop_count) || (a.overall_rank - b.overall_rank)); });
            state.watched = new Set(response.watched || []);

            // 核心修复：保留全局作品库(内含标签)供前端随意检索，其他笨重的人物字典留空
            state.detail = {
                anime: response.anime_map || {},
                persons: {},
                characters: {},
                career_staff: {},
                career_va: {}
            };
            detailFetchedSubjects.clear();
            state.selectedSubject = null;
            state.detailView = null;
            resetDetailPersonState(true);
            resetDetailView();

            // 预建"标签→作品id"索引，加速标签关联搜索（失败则回退全量扫描）
            try {
                tagIndex = new Map();
                for (const sid in state.detail.anime) {
                    const a = state.detail.anime[sid];
                    if (a.tags) {
                        for (const t of a.tags) {
                            if (!t || !t[0]) continue;
                            if (!tagIndex.has(t[0])) tagIndex.set(t[0], new Set());
                            tagIndex.get(t[0]).add(sid);
                        }
                    }
                }
            } catch {
                tagIndex = null;
            }

            state.hideUnwatched = state.watched.size > 0;
            document.getElementById('hide-unwatched-btn').innerText = state.hideUnwatched ? "显示全部" : "隐藏未看";

            // 数据整体变更：使三视图缓存全部失效
            tableEpoch++;
            await refreshDataDate();

            renderTable();
            renderBroadcast();
            renderPlan();
        }

            btn.style.cursor = 'wait';
            setProgressFill(btn, 0);

            const poll = pollProgress(btn, api.getBroadcastProgress, (pd, b) => {
                const progress = pd.progress || "";
                const m = progress.match(/(\d{1,3})\s*%/);
                if (m) {
                    setProgressSmooth(b, parseInt(m[1], 10));
                    b.innerText = shortProgressText(progress);
                }
            });

            try {
                const result = await api.autoUpdateBroadcast();
                poll.stop();
                if (result && result.updated) {
                    state.data.broadcast = result.broadcast || [];
                    renderBroadcast();
                }
            } catch (err) {
                poll.stop();
                console.warn('自动更新排期失败:', err);
            } finally {
                clearProgressFill(btn);
                btn.disabled = false;
                btn.innerText = originalText;
                btn.style.cursor = 'pointer';
            }
        }

        // ==================== 名次窗口滑块 ====================
        // 重建列组/表头：列数 = 名次范围跨度，表头显示绝对名次；表格宽度同步
        // 表头构建(横/纵轴统一入口)：colgroup/thead 拼好后统一提交，轴差异只体现在结构拼装里
        function buildTableHead(groups) {
            const commit = (colgroupHtml, theadHtml, tableWidth) => {
                document.getElementById('rank-table-colgroup').innerHTML = colgroupHtml;
                document.getElementById('rank-table-head').innerHTML = theadHtml;
                document.querySelector('.data-table').style.width = tableWidth + 'px';
            };

                if (!groups) {

                }
                let colgroup = '<col class="col-rank">';
                groups.forEach(() => { colgroup += '<col class="title-col"><col class="icon-col">'; });
                const yearBlocks = [];
                groups.forEach(g => {
                    const y = g[0][0];
                    const last = yearBlocks[yearBlocks.length - 1];
                    if (last && last.year === y) last.count++;
                    else yearBlocks.push({ year: y, count: 1 });
                });
                let theadHtml = '<tr><th class="col-rank h-mode-toggle">年份</th>';
                yearBlocks.forEach(b => {
                    theadHtml += `<th class="col-year" colspan="${b.count * 2}" data-year="${b.year}">${b.year}</th>`;
                });
                theadHtml += '</tr><tr><th class="col-rank h-mode-toggle">季度</th>';
                groups.forEach((g, gi) => {
                    theadHtml += `<th class="col-quarter" colspan="2" data-year="${g[0][0]}" data-quarter="${g[0][1]}" data-gi="${gi}">${g[0][1]}</th>`;
                });
                theadHtml += '</tr>';
                commit(colgroup, theadHtml, 64 + groups.length * 160);
                return;
            }
            const r = rankRange();
            const cols = r[1] - r[0] + 1;
            let colgroupHtml = '<col class="col-year"><col class="col-quarter">';
            for (let i = 0; i < cols; i++) { colgroupHtml += '<col class="title-col"><col class="icon-col">'; }
            colgroupHtml += '<col class="col-watch">';
            let theadHtml = '<tr><th class="col-year">年份</th><th class="col-quarter">季度</th>';
            for (let i = r[0]; i <= r[1]; i++) { theadHtml += `<th class="rank-header" colspan="2">第${i}名</th>`; }
            theadHtml += '<th class="watch-header col-watch">完成率</th>';
            theadHtml += '</tr>';
            commit(colgroupHtml, theadHtml, 164 + cols * 160);
        }

        // 用标签自身(Range)量出其最长候选文本的真实渲染宽度
        // 隐藏标签(如 评级控制下的名次/年份)临时强制可见再量：用 !important 覆盖 .rating-settings 的 display:none !important
        function sliderLabelMaxTextWidth(el, texts) {
            const hidden = getComputedStyle(el).display === 'none';
            const oldW = el.style.width, oldT = el.textContent;
            const saved = [];
            if (hidden) {
                ['display', 'position', 'visibility', 'white-space'].forEach(function(p) {
                    saved.push([p, el.style.getPropertyValue(p), el.style.getPropertyPriority(p)]);
                });
                el.style.setProperty('display', 'inline-block', 'important');
                el.style.setProperty('position', 'absolute', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
                el.style.setProperty('white-space', 'nowrap', 'important');
            }
            el.style.width = 'auto';
            let m = 0;
            for (const t of texts) {
                el.textContent = t;
                const range = document.createRange();
                range.selectNodeContents(el);
                m = Math.max(m, range.getBoundingClientRect().width);
            }
            el.textContent = oldT;
            el.style.width = oldW;
            if (hidden) {
                saved.forEach(function(s) {
                    if (s[1]) el.style.setProperty(s[0], s[1], s[2]); else el.style.removeProperty(s[0]);
                });
            }
            return m;
        }

        // 四个滑条标签定宽 = 各自最长文本的真实宽度：居中显示，标签最长时间隙与按钮间隙一致

        // 名次范围变化(松开滑块/点击滑轨)：重建表头、失效三视图缓存并重渲染
        function applyRankRange() {

        // 参考年份滑块：宽窗口越界时塌缩为单一名次窗口；已是单一名次窗口时继续拖动则整窗平移
        function onRankInput(e) {
            const minInput = document.getElementById('rank-min');
            const maxInput = document.getElementById('rank-max');
            let l = parseInt(minInput.value, 10);
            let r = parseInt(maxInput.value, 10);
            const draggingMin = e.target.id === 'rank-min';
            const width = lastRankMax - lastRankMin;
            const bottom = parseInt(minInput.min, 10);
            const top = parseInt(maxInput.max, 10);
            if (draggingMin && l >= r) {
                if (width === 1) {
                    // 单一名次窗口：整窗右移一格(顶线处停住)
                    const aim = Math.min(l, top - 1);
                    l = aim;
                    r = aim + 1;
                } else {
                    // 宽窗口：塌缩成贴住右滑块的单一名次窗口
                    l = r - 1;
                }
            } else if (!draggingMin && r <= l) {
                if (width === 1) {
                    // 单一名次窗口：整窗左移一格(底线处停住)
                    if (r - 1 > bottom) {
                        l = r - 1;
                    } else {
                        l = bottom;
                        r = bottom + 1;
                    }
                } else {
                    // 宽窗口：塌缩成贴住左滑块的单一名次窗口
                    r = l + 1;
                }
            }
            minInput.value = l;
            maxInput.value = r;
            updateRankLabel();
        }

        // ==================== 评级设置滑块(评分三头 / 热度两头) ====================
        // 推挤链：v 按索引降序(0 最大)，相邻差 >= step，范围 [min,max]；拖拽索引 d，邻居被互相推动
        function applyPush(v, d, step, min, max) {
            const snap = x => Number(Math.min(max, Math.max(min, Math.round(x / step) * step)).toFixed(2));
            const n = v.length;
            v[d] = snap(v[d]);
            for (let i = d - 1; i >= 0; i--) v[i] = snap(Math.max(v[i], v[i + 1] + step));
            for (let i = d + 1; i < n; i++) v[i] = snap(Math.min(v[i], v[i - 1] - step));
            for (let i = 1; i < n; i++) v[i] = snap(Math.min(v[i], v[i - 1] - step));
            for (let i = n - 2; i >= 0; i--) v[i] = snap(Math.max(v[i], v[i + 1] + step));
            for (let i = 1; i < n; i++) v[i] = snap(Math.min(v[i], v[i - 1] - step));
        }

        // 评分三头：相邻互相推挤(星≥绿≥白，步长 0.1)
        function onRatingInput(e) {
            const els = ['rating-star', 'rating-green', 'rating-white'].map(id => document.getElementById(id));
            const step = 0.1, min = 0, max = 10;
            const d = els.findIndex(el => el.id === e.target.id);
            const v = els.map(el => parseFloat(el.value));
            applyPush(v, d, step, min, max);
            els.forEach((el, i) => { el.value = v[i]; });
            state.ratingCuts = v.slice();
            updateRatingLabel();
            updateRatingSegs();
        }

        // 热度两头：heat-a=降一级阈值(后X%)、heat-b=降两级阈值(后Y%)，步长 1%
        function onHeatInput(e) {
            const a = document.getElementById('heat-a');
            const b = document.getElementById('heat-b');
            const step = 1, min = 0, max = 100;
            const d = e.target.id === 'heat-a' ? 0 : 1;
            const v = [parseInt(a.value, 10), parseInt(b.value, 10)];
            applyPush(v, d, step, min, max);
            a.value = v[0]; b.value = v[1];
            state.heatPct = v[0]; state.heatPct2 = v[1];
            updateHeatLabel();
            updateHeatSegs();
        }

        function fmtCut(v) {
            return Number(v).toFixed(1);
        }
        function updateRatingLabel() {
            const c = state.ratingCuts.map(fmtCut);
            document.getElementById('rating-label').innerText = `评分：${c[0]}/${c[1]}/${c[2]}`;
        }
        function updateHeatLabel() {
            document.getElementById('heat-label').innerText = `热度：${state.heatPct}％/${state.heatPct2}％`;
        }

        // 名次/年份：两拇指之间填充蓝色
        function updateRangeFill(wrap) {
            if (!wrap) return;
            const fill = wrap.querySelector('.range-fill');
            const inputs = wrap.querySelectorAll('input[type="range"]');
            if (!fill || inputs.length < 2) return;
            const w = wrap.clientWidth;
            if (!w) return;
            const min = parseFloat(inputs[0].min), max = parseFloat(inputs[0].max), thumb = 16;
            const xOf = v => thumb / 2 + (v - min) / (max - min) * Math.max(1, w - thumb);
            const x1 = xOf(parseFloat(inputs[0].value));
            const x2 = xOf(parseFloat(inputs[1].value));
            fill.style.left = Math.min(x1, x2) + 'px';
            fill.style.width = Math.abs(x2 - x1) + 'px';
        }
        function updateRankYearFills() {
            updateRangeFill(document.querySelector('.rank-range'));
            updateRangeFill(document.querySelector('.year-range'));
        }

        // 评分滑块：数值左右翻转(10 在左)，四段 黄(星)/绿/白/红
        function updateRatingSegs() {
            const wrap = document.querySelector('.rating-range');
            if (!wrap) return;
            const segs = wrap.querySelectorAll('.seg');
            const w = wrap.clientWidth;
            if (!w) return;
            const thumb = 16, max = 10;
            const xOf = v => thumb / 2 + (1 - v / max) * (w - thumb);
            const xc = state.ratingCuts.map(xOf);
            const bounds = [0, xc[0], xc[1], xc[2], w];
            segs.forEach((s, i) => { s.style.left = bounds[i] + 'px'; s.style.width = Math.max(0, bounds[i + 1] - bounds[i]) + 'px'; });
        }

        // 热度滑块：数值左右翻转(100 在左)，两拇指三段 绿/白/红
        function updateHeatSegs() {
            const wrap = document.querySelector('.heat-range');
            if (!wrap) return;
            const segs = wrap.querySelectorAll('.seg');
            const w = wrap.clientWidth;
            if (!w) return;
            const thumb = 16, max = 100;
            const xOf = v => thumb / 2 + (1 - v / max) * (w - thumb);
            const bounds = [0, xOf(state.heatPct), xOf(state.heatPct2), w];
            segs.forEach((s, i) => { s.style.left = bounds[i] + 'px'; s.style.width = Math.max(0, bounds[i + 1] - bounds[i]) + 'px'; });
        }

        function updateYearLabel(e) {
            const minInput = document.getElementById('year-min');
            const maxInput = document.getElementById('year-max');
            let minVal = parseInt(minInput.value);
            let maxVal = parseInt(maxInput.value);
            const bottom = 1999;
            const top = parseInt(maxInput.max);

            if (e) {
                // 分离不变量：min 严格小于 max，两滑块永远不重合
                // 拖动一侧撞上/越过另一侧时：
                //   · 若窗口恰为单年(相邻，width=1) → 整窗随拖动方向平移一格(连续拖动逐格推进)，
                //     直到另一侧已到底/到顶(此时滑块停住不再前进)
                //   · 若窗口较宽 → 塌缩为单年窗口贴在对侧
                const draggingMin = e.target.id === 'year-min';
                const width = lastYearMax - lastYearMin;
                if (draggingMin && minVal >= maxVal) {
                    if (width === 1) {
                        // 单年窗口：整窗右移一格(顶线处停住)
                        const aim = Math.min(minVal, top - 1);
                        minVal = aim;
                        maxVal = aim + 1;
                    } else {
                        // 宽窗口：塌缩成贴住右滑块的单年窗口
                        minVal = maxVal - 1;
                    }
                } else if (!draggingMin && maxVal <= minVal) {
                    if (width === 1) {
                        // 单年窗口：整窗左移一格(底线 1999 处停住)
                        if (maxVal > bottom) {
                            minVal = maxVal - 1;
                        } else {
                            minVal = bottom;
                            maxVal = bottom + 1;
                        }
                    } else {
                        // 宽窗口：塌缩成贴住左滑块的单年窗口
                        maxVal = minVal + 1;
                    }
                }
                minInput.value = minVal;
                maxInput.value = maxVal;
            }
            lastYearMin = minVal;
            lastYearMax = maxVal;

            // 左滑块 1999 = "20世纪末"(2000 年前聚合行开关)；右滑块落在 20 世纪末区间同理；下界超出当前年份 = "未来"
            const lo = minVal === 1999 ? '20世纪末' : (minVal > state.currentYear ? '未来' : minVal);
            let hi;
            if (minVal === maxVal) {
                hi = lo;
            } else if (minVal === 1999 && maxVal <= 2000) {
                hi = '20世纪末';
            } else if (maxVal >= top) {
                // 右滑块顶格(最后一格) = "未来"：显示未来季度(未播出)作品行
                hi = '未来';
            } else {
                hi = maxVal - 1;
            }
            // 上下界文字一致(单一年份窗口)时只显示一个，如 "2024" / "20世纪末"
            const labelText = String(lo) === String(hi) ? String(hi) : `${lo} - ${hi}`;
            document.getElementById('year-label').innerText = `年份: ${labelText}`;
            updateRankYearFills();
        }

        function editUpdateTime(event, id) {
            event.stopPropagation();
            const targetSpan = event.currentTarget;
            if (targetSpan.querySelector('input')) return;

            const anime = state.data.broadcast.find(a => a.id.toString() === id.toString());
            if (!anime) return;

            const currentTimeStr = anime.update_time && anime.update_time.includes(':')
                ? anime.update_time.replace(':', '')
                : '';

            // 编辑期间：禁用卡片省略号裁剪，并隐藏"开播… | "前缀给输入框腾出空间
            const cardInfo = targetSpan.closest('.card-info');
            if (cardInfo) {
                cardInfo.classList.add('editing');
                const prefix = cardInfo.firstChild;
                if (prefix && prefix.nodeType === Node.TEXT_NODE) prefix.textContent = '';
            }

            targetSpan.innerHTML = `更新: <input type="text" value="${currentTimeStr}" maxlength="4" style="width: 36px; border: 1px solid #33bbff; border-radius: 2px; font-size: 12px; outline: none; text-align: center; padding: 0;">`;
            const inputEl = targetSpan.querySelector('input');
            inputEl.focus();
            // 自动全选已有时间，直接输入即可覆盖
            inputEl.select();

            inputEl.addEventListener('input', function() {
                // 全角数字先转半角，再过滤非数字
                this.value = this.value
                    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                    .replace(/\D/g, '');
            });

            let isSaved = false;
            const saveAndExit = () => {
                if (isSaved) return;
                isSaved = true;
                const newVal = inputEl.value;
                if (newVal.length === 4) {
                    const formattedTime = newVal.slice(0, 2) + ':' + newVal.slice(2, 4);
                    anime.update_time = formattedTime;
                    anime.sort_time = formattedTime;
                    api.saveBroadcastData(state.data.broadcast);
                }
                renderBroadcast();
            };

            inputEl.addEventListener('blur', saveAndExit);
            inputEl.addEventListener('keydown', function(e) {
                // 输入法组合期间的回车不参与保存，避免 isSaved 被提前置位导致无法修改
                if (e.isComposing || e.keyCode === 229) return;
                if (e.key === 'Enter') {
                    // 不足四位不保存，保持编辑态继续输入
                    if (inputEl.value.length === 4) saveAndExit();
                } else if (e.key === 'Escape') {
                    isSaved = true;
                    renderBroadcast();
                }
            });
        }

        // 读取搜索框内容：返回原始文本与规范化后的关键词
        function getSearchKeyword() {
            const inputEl = document.getElementById('search-input');
            return { inputEl, rawText: inputEl.value, keyword: inputEl.value.toLowerCase().trim() };
        }

        function handleSearchKey(event) {
            // 输入法组合期间的回车(如中文输入法按回车确认候选词)不参与搜索逻辑，
            // 避免同一次回车被重复触发，导致搜索框被误清空/重复跳转
            if (event.isComposing || event.keyCode === 229) return;
            if (event.key === 'Escape') {
                if (searchState.isActive) clearSearch();
                return;
            }
            if (event.key === 'Enter') {
                const { inputEl, rawText, keyword } = getSearchKeyword();
                if (searchState.isActive && keyword === searchState.keyword) {
                    findNextMatch();
                } else if (keyword !== '') {
                    // 搜索框内容与点击词条名一致 -> 关联搜索(标签/制作人员/声优)，否则普通关键词搜索
                    if (isRelatedKeyword(keyword)) {
                        startRelatedSearch();
                    } else {
                        startNewSearch(keyword, rawText);
                    }
                    // startNewSearch 内部会调用 clearSearch() 清空输入框，
                    // 这里把用户输入的内容放回去，保证回车能继续跳转下一个匹配
                    inputEl.value = rawText;
                }
            }
        }

        function handleSearchBtn() {
            const { inputEl, rawText, keyword } = getSearchKeyword();
            if (keyword === '') {
                if (searchState.isActive) clearSearch();
                return;
            }
            if (isRelatedKeyword(keyword)) {
                startRelatedSearch();
                inputEl.value = rawText;
                inputEl.focus();
                return;
            }
            if (searchState.isActive) {
                clearSearch();
            } else {
                startNewSearch(keyword, rawText);
                inputEl.value = rawText;
                // 焦点归还输入框：否则焦点停在“清除”按钮上，再按回车会误触发清除
                inputEl.focus();
            }
        }

        async function addManualAnime() {
            const input = document.getElementById('manual-input');
            const keyword = input.value.trim();
            if (!keyword) return;

            const btn = document.getElementById('manual-add-btn');
            btn.disabled = true;
            btn.innerText = '搜索中...';

            try {
                const response = await api.searchAndAddAnime(keyword);
                if (response.error) {
                    alert('添加失败：' + response.error);
                } else {
                    const rawId = response.anime.id.toString().replace('manual_', '');
                    if (state.data.broadcast.some(a => a.id.toString().replace('manual_', '') === rawId)) {
                        alert('时间表中已存在该动画！');
                        return;
                    }
                    state.data.broadcast.push(response.anime);
                    await api.saveBroadcastData(state.data.broadcast);
                    renderBroadcast();
                    input.value = '';
                }
            } catch (err) {
                alert('发生异常：' + err);
            } finally {
                btn.disabled = false;
                btn.innerText = '添加';
            }
        }

        function handleManualKey(event) {
            if (event.key === 'Enter') {
                addManualAnime();
            }
        }

        function setProgressFill(btn, percent) {
            const p = Math.max(0, Math.min(100, Math.round(percent)));
            btn.style.backgroundImage = `linear-gradient(to right, #47b347 ${p}%, rgba(255, 255, 255, 0) ${p}%)`;
        }
        // 平滑补间：两次轮询之间用动画渐变过渡，避免进度跳变
        function setProgressSmooth(btn, target) {
            const start = btn._progressShown ?? 0;
            if (btn._progressRaf) cancelAnimationFrame(btn._progressRaf);
            const delta = target - start;
            const startTime = performance.now();
            const duration = 250;
            const step = (now) => {
                const t = Math.min(1, (now - startTime) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                const val = start + delta * eased;
                btn._progressShown = val;
                setProgressFill(btn, val);
                if (t < 1) {
                    btn._progressRaf = requestAnimationFrame(step);
                } else {
                    btn._progressRaf = null;
                }
            };
            btn._progressRaf = requestAnimationFrame(step);
        }
        function clearProgressFill(btn) {
            if (btn._progressRaf) { cancelAnimationFrame(btn._progressRaf); btn._progressRaf = null; }
            btn._progressShown = 0;
            btn.style.backgroundImage = '';
        }
        // 轮询后端进度并平滑更新按钮进度条；返回 { stop() } 用于停止轮询
        // 后端进度原文 -> 统一的短格式「阶段 N%」，消除按钮文字长短差异
        function shortProgressText(text) {
            text = String(text || '');
            const m = text.match(/(\d{1,3})\s*%/);
            if (!m) return text;
            const pct = m[1];
            const rules = [
                ['连接', '连接'], ['下载', '下载'], ['解压', '解压'],
                ['榜单', '榜单'], ['详情', '详情'], ['履历', '履历'],
                ['同步', '同步'], ['保存', '保存'], ['更新', '更新'],
                ['完成', '完成'], ['最新', '最新'], ['版本', '检查']
            ];
            for (const [kw, label] of rules) {
                if (text.includes(kw)) return label + ' ' + pct + '%';
            }
            return pct + '%';
        }

        function pollProgress(btn, apiCall, onProgress) {
            let finished = false;
            const timer = setInterval(async () => {
                try {
                    if (finished) return;
                    const pd = await apiCall();
                    if (finished) return;
                    if (onProgress) onProgress(pd, btn);
                } catch {}
            }, 200);
            return {
                stop() { finished = true; clearInterval(timer); }
            };
        }

        async function updateArchiveData() {
            const btn = document.getElementById('update-btn');
            const originalText = "更新数据";

            try { await api.getUpdateProgress(); } catch {}

            btn.innerText = "准备更新...";
            btn.disabled = true;
            btn.style.cursor = "wait";
            setProgressFill(btn, 2);

            // 先启动轮询，更新期间实时显示后端上报的进度（下载/解析/保存各阶段）
            const poll = pollProgress(btn, api.getUpdateProgress, (pd, b) => {
                const progress = pd.progress || "";
                const error = pd.error || "";
                if (error) {
                    b.innerText = "更新失败";
                    return;
                }
                if (progress) {
                    b.innerText = shortProgressText(progress);
                    const m = progress.match(/(\d{1,3})\s*%/);
                    if (m) setProgressSmooth(b, parseInt(m[1], 10));
                } else {
                    b.innerText = "更新中...";
                }
            });

            let response;
            try {
                response = await api.updateLocalData();
            } catch (err) {
                poll.stop();
                clearProgressFill(btn);
                btn.innerText = "发生异常";
                const progress = await api.getUpdateProgress();
                if (progress.error) { alert("更新失败：" + progress.error); } 
                else { alert("更新失败，请查看控制台错误信息。"); }
                btn.disabled = false; btn.style.cursor = "pointer"; btn.style.backgroundColor = ""; btn.innerText = originalText;
                return;
            }

            poll.stop();

            if (response.error) {
                clearProgressFill(btn);
                btn.innerText = "更新失败";
                const progress = await api.getUpdateProgress();
                if (progress.error) { alert("更新失败：" + progress.error); } 
                else { alert("更新失败：" + response.error); }
                btn.disabled = false; btn.style.cursor = "pointer"; btn.style.backgroundColor = ""; btn.innerText = originalText;
                return;
            }

            clearProgressFill(btn);
            btn.innerText = "更新成功";
            btn.style.backgroundColor = "#47b347";

            // 独立兜底定时器：无论数据刷新是否完成/挂起，3 秒后必定恢复按钮默认状态
            const restoreTimer = setTimeout(() => {
                clearProgressFill(btn);
                btn.innerText = originalText;
                btn.style.backgroundColor = "";
                btn.disabled = false;
                btn.style.cursor = "pointer";
            }, 3000);

            try {
                await loadRealData();
            } catch (e) {
                console.warn('更新后刷新数据失败:', e);
            } finally {
                clearTimeout(restoreTimer);
                clearProgressFill(btn);
                btn.innerText = originalText;
                btn.style.backgroundColor = "";
                btn.disabled = false;
                btn.style.cursor = "pointer";
            }
        }

        async function syncUserData() {
            const usernameInput = document.getElementById('username-input').value.trim();
            persistUsername();
            const btn = document.getElementById('sync-btn');
            const originalText = "同步";

            btn.innerText = "同步中...";
            btn.disabled = true;
            setProgressFill(btn, 0);

            const poll = pollProgress(btn, api.getSyncProgress, (pd, b) => {
                const progress = pd.progress || "";
                const m = progress.match(/(\d{1,3})\s*%/);
                if (m) {
                    setProgressSmooth(b, parseInt(m[1], 10));
                    b.innerText = shortProgressText(progress);
                }
            });

            try {
                const response = await api.syncUserData(usernameInput);
                poll.stop();
                if (response.error) {
                    alert('同步失败：' + response.error);
                    clearProgressFill(btn); btn.innerText = "同步失败";
                } else {
                    state.watched = new Set(response.watched);
                    state.hideUnwatched = state.watched.size > 0;
                    document.getElementById('hide-unwatched-btn').innerText = state.hideUnwatched ? "显示全部" : "隐藏未看";
                    // 已看集合整体变化：视图缓存失效
                    tableEpoch++;
                    renderTable();
                    renderBroadcast();
                    // 同步后自动移除补番计划中已看的作品
                    if (state.data.plan && state.data.plan.length > 0) {
                        const before = state.data.plan.length;
                        state.data.plan = state.data.plan.filter(e => !state.watched.has(String(e.sid)));
                        if (state.data.plan.length < before) {
                            api.savePlanData(state.data.plan);
                            renderPlan();
                        }
                    }
                    clearProgressFill(btn); btn.innerText = "同步成功"; btn.style.backgroundColor = "#47b347";
                }
            } catch (err) {
                poll.stop();
                clearProgressFill(btn); btn.innerText = "发生异常";
            } finally {
                setTimeout(() => { clearProgressFill(btn); btn.innerText = originalText; btn.disabled = false; btn.style.backgroundColor = ""; }, 2000);
            }
        }

        async function updateBroadcastData() {
            const btn = document.getElementById('update-broadcast-btn');
            const originalText = "更新数据";
            btn.innerText = "更新中...";
            btn.disabled = true;
            setProgressFill(btn, 0);

            const poll = pollProgress(btn, api.getBroadcastProgress, (pd, b) => {
                const progress = pd.progress || "";
                const m = progress.match(/(\d{1,3})\s*%/);
                if (m) {
                    setProgressSmooth(b, parseInt(m[1], 10));
                    b.innerText = shortProgressText(progress);
                }
            });

            try {
                const response = await api.updateBroadcastData();
                poll.stop();
                if (response.error) {
                    clearProgressFill(btn); btn.innerText = "更新失败";
                } else {
                    state.data.broadcast = response.broadcast;
                    renderBroadcast();
                    clearProgressFill(btn); btn.innerText = "更新成功"; btn.style.backgroundColor = "#47b347";
                }
            } catch (err) {
                poll.stop();
                clearProgressFill(btn); btn.innerText = "发生异常";
            } finally {
                setTimeout(() => { clearProgressFill(btn); btn.innerText = originalText; btn.disabled = false; btn.style.backgroundColor = ""; }, 2000);
            }
        }

        async function initTheme() {
            try {
                const theme = await api.getTheme();
                const isDark = theme === 'dark';
                document.body.classList.toggle('dark-theme', isDark);
                document.getElementById('theme-toggle-btn').innerText = isDark ? '开灯' : '关灯';
                try { localStorage.setItem('appTheme', isDark ? 'dark' : 'light'); } catch (e) {}
            } catch {
                document.body.classList.add('dark-theme');
                document.getElementById('theme-toggle-btn').innerText = '开灯';
            }
        }

        async function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            document.getElementById('theme-toggle-btn').innerText = isDark ? '开灯' : '关灯';
            try { localStorage.setItem('appTheme', isDark ? 'dark' : 'light'); } catch (e) {}
            try {
                await api.setTheme(isDark ? 'dark' : 'light');
            } catch {}
        }

        // 面板样式：panel=六维面板(六维图) / data=数据面板；每次启动固定为六维面板
        function tipModeLabel(mode) {
            return mode === 'panel' ? '六维面板' : '数据面板';
        }

        // 显示时机：hover=鼠标悬停即显示 / select=只在选中作品或行列区域标记时显示
        function tipTriggerLabel(trigger) {
            return trigger === 'select' ? '选中显示' : '悬停显示';
        }

        // 设置：时间轴/倒序/显示时机/六维面板/详细数据；保存到 app_state，重启后延续
        async function loadUiSettings() {
            let s = {};
            try { s = await api.getUiSettings(); } catch (e) { s = {}; }
            if (!s || typeof s !== 'object') s = {};
            const hasNew = ('tipRadar' in s) || ('tipDetail' in s);
            return {
                timeAxis: s.timeAxis === 'h' ? 'h' : 'v',
                sortDescending: s.sortDescending !== false,
                tipTrigger: s.tipTrigger === 'hover' ? 'hover' : 'select',
                // 旧版单一 tipMode 迁移：panel → 仅六维；data → 仅详细
                tipRadar: hasNew ? s.tipRadar !== false : s.tipMode !== 'data',
                tipDetail: hasNew ? s.tipDetail === true : s.tipMode === 'data'
            };
        }

        function saveUiSettings() {
            try {
                api.saveUiSettings({
                    timeAxis: state.timeAxis,
                    sortDescending: state.sortDescending,
                    tipTrigger: state.tipTrigger,
                    tipRadar: state.tipRadar,
                    tipDetail: state.tipDetail,
                    // 兼容旧字段：仅详细开启时写 data，其余写 panel
                    tipMode: (state.tipDetail && !state.tipRadar) ? 'data' : 'panel'
                });
            } catch (e) {}
        }

        // 把设置应用到 state 并同步 UI
        function applyUiValues(s) {
            if (!s || typeof s !== 'object') return;
            state.timeAxis = s.timeAxis === 'h' ? 'h' : 'v';
            state.sortDescending = s.sortDescending !== false;
            state.tipTrigger = s.tipTrigger === 'hover' ? 'hover' : 'select';
            const hasNew = ('tipRadar' in s) || ('tipDetail' in s);
            state.tipRadar = hasNew ? s.tipRadar !== false : s.tipMode !== 'data';
            state.tipDetail = hasNew ? s.tipDetail === true : s.tipMode === 'data';
            const swAxis = document.getElementById('sw-time-axis');
            if (swAxis) swAxis.checked = state.timeAxis === 'v';
            const lblAxis = document.getElementById('lbl-time-axis');
            if (lblAxis) lblAxis.innerText = state.timeAxis === 'h' ? '时间横轴' : '时间纵轴';
            document.body.classList.toggle('h-axis', state.timeAxis === 'h');
            const swOrder = document.getElementById('sw-order');
            if (swOrder) swOrder.checked = state.sortDescending;
            const lblOrder = document.getElementById('lbl-order');
            if (lblOrder) lblOrder.innerText = state.sortDescending ? '时间倒序' : '时间顺序';
            updateTipTriggerUI();
            updateTipPanelsUI();
        }

        // 首帧同步恢复：主程序随 URL 传入的上次设置(无则保持默认)
        function applyUiSettingsSync() {
            if (window.__initUi) applyUiValues(window.__initUi);
        }

        // 通过 API 读取并应用(兜底/一致性校正)
        async function applyUiSettings() {
            applyUiValues(await loadUiSettings());
        }

        async function initTipMode() {
            // 沿用上次保存的面板组合/显示时机，这里只同步 UI
            updateTipPanelsUI();
            updateTipTriggerUI();
        }

        function updateTipPanelsUI() {
            const swRadar = document.getElementById('sw-tip-radar');
            if (swRadar) swRadar.checked = state.tipRadar;
            const swDetail = document.getElementById('sw-tip-detail');
            if (swDetail) swDetail.checked = state.tipDetail;
        }

        // 当前已显示的提示按新组合立即重绘
        function rerenderVisibleTips() {
            if (iconTipVisible() && iconTipTd) showIconTip(iconTipTd, true);
            if (statsTipVisible() && statsTipCell) showStatsTip(statsTipCell, true);
        }

        function toggleTipRadar() {
            state.tipRadar = !state.tipRadar;
            updateTipPanelsUI();
            rerenderVisibleTips();
            saveUiSettings();
        }

        function toggleTipDetail() {
            state.tipDetail = !state.tipDetail;
            updateTipPanelsUI();
            rerenderVisibleTips();
            saveUiSettings();
        }

        function updateTipTriggerUI() {
            const sw = document.getElementById('sw-tip-trigger');
            if (sw) sw.checked = state.tipTrigger === 'select';
            const lbl = document.getElementById('lbl-tip-trigger');
            if (lbl) lbl.innerText = tipTriggerLabel(state.tipTrigger);
        }

        function toggleTipTrigger() {
            state.tipTrigger = state.tipTrigger === 'select' ? 'hover' : 'select';
            updateTipTriggerUI();
            // 切换时先收起所有悬停框，再按当前选中/标记补显示
            hideIconTip();
            hideStatsTip();
            hideWatchTip();
            // 切到选中显示→按选中/标记设置层级；切到悬停显示→清空(随后由鼠标决定)
            if (tipPinned()) updateStickyLayers();
            else setStickyBoost(null);
            showSelectionTip();
            saveUiSettings();
        }

        // 悬停框是否"固定"：仅"选中显示"模式固定；"悬停显示"模式下面板始终跟随鼠标
        function tipPinned() {
            return state.tipTrigger === 'select';
        }
        // 收起全部悬停框
        function hideAllTips() {
            hideIconTip();
            hideStatsTip();
            hideWatchTip();
        }

        // 按当前选中作品 / 行列区域标记显示对应面板；无固定目标时收起
        // (显示不再与白框/标记框联动；面板只在表格可视区内裁剪显示)
        function showSelectionTip() {
            // 悬停显示模式：面板完全由鼠标悬停驱动，点击/选中不影响
            if (!tipPinned()) return;
            // 单格选中优先：显示该作品的悬停框
            if (state.selectedSubject) {
                const titleCell = document.querySelector(`#rank-table-body td.title-col[data-sid="${state.selectedSubject}"]`);
                const icon = titleCell ? titleCell.nextElementSibling : null;
                if (icon && icon.classList.contains('icon-col')) { showIconTip(icon); return; }
            }
            // 来自"完成率"格的标记：同区域但显示完成率悬停框
            if (headerMark && headerMark.from === 'watch') {
                const wc = markedWatchCell();
                if (wc && wc.dataset.wctip) { showWatchTip(wc); return; }
                hideAllTips();
                return;
            }
            // 行列/区域标记：按其类型找对应年份/季度/名次格，显示统计悬停框
            const marked = markedStatsCell();
            if (marked) { showStatsTip(marked); return; }
            hideAllTips();
        }

        // 完成率标记对应的完成率格(纵轴=该行完成率格；横轴=底部完成率行该季度格)
        function markedWatchCell() {
            const mark = headerMark;
            if (!mark) return null;
            if (state.timeAxis === 'h') {
                for (const c of document.querySelectorAll('#rank-table-body tr.watch-row td.col-watch-h')) {
                    if (parseInt(c.dataset.year, 10) === mark.year
                        && (mark.type === 'year' || c.dataset.quarter === mark.quarter)) return c;
                }
                return null;
            }
            for (const tr of document.querySelectorAll('#rank-table-body tr')) {
                const ctx = rowContextOf(tr);
                if (ctx.year === mark.year && (mark.type === 'year' || ctx.quarter === mark.quarter)) {
                    return tr.querySelector('td.col-watch');
                }
            }
            return null;
        }

        // 当前 headerMark 对应的统计格(年份格/季度格/名次表头)
        function markedStatsCell() {
            const mark = headerMark;
            if (!mark) return null;
            if (state.timeAxis === 'h') {
                // 时间横轴：名次=行首格；年份/季度=表头列
                if (mark.type === 'rank') {
                    return document.querySelectorAll('#rank-table-body td.col-rank')[mark.index] || null;
                }
                if (mark.type === 'year') {
                    return document.querySelector(`#rank-table-head th.col-year[data-year="${mark.year}"]`);
                }
                if (mark.type === 'quarter') {
                    for (const th of document.querySelectorAll('#rank-table-head th.col-quarter')) {
                        if (parseInt(th.dataset.year, 10) === mark.year && th.dataset.quarter === mark.quarter) return th;
                    }
                    return null;
                }
                return null;
            }
            if (mark.type === 'rank') {
                const ths = document.querySelectorAll('#rank-table-head th.rank-header');
                return ths[mark.index] || null;
            }
            if (mark.type === 'year') {
                for (const c of document.querySelectorAll('#rank-table-body td.col-year')) {
                    if (parseInt(c.textContent, 10) === mark.year) return c;
                }
                return null;
            }
            if (mark.type === 'quarter') {
                for (const c of document.querySelectorAll('#rank-table-body td.col-quarter')) {
                    const ctx = rowContextOf(c.closest('tr'));
                    if (ctx.year === mark.year && ctx.quarter === mark.quarter) return c;
                }
                return null;
            }
            return null;
        }

        // 范围控制 / 评级控制：切换底栏滑块组(仅影响显示)
        function toggleSliderMode() {
            state.ratingEnabled = !state.ratingEnabled;
            document.body.classList.toggle('rating-settings', state.ratingEnabled);
            document.getElementById('slider-mode-btn').innerText = state.ratingEnabled ? '评级控制' : '范围控制';
            requestAnimationFrame(function() { syncSliderLabelWidths(); updateRatingSegs(); updateHeatSegs(); updateRankYearFills(); });
        }

        
        // 通用样式浮层弹窗(复用"软件说明"外观)，lines 为纯文本行
        function showStyledModal(title, lines) {
            document.getElementById('help-modal-title').innerText = title;
            const body = document.getElementById('help-modal-body');
            body.innerHTML = '';
            lines.forEach(t => {
                const div = document.createElement('div');
                div.textContent = t;
                body.appendChild(div);
            });
            document.getElementById('help-modal-overlay').style.display = 'flex';
        }

                "   • 点击搜索结果回填名称；直接点“标记”会按搜索框内容搜索并标记第一个结果；\n" +

                "【注意】\n" +
                "• 数据保存在软件同目录 date/ 文件夹。";
            showStyledModal('AnimeList_v4.4 使用说明', helpText.split('\n'));
        }

        function closeHelp() {
            document.getElementById('help-modal-overlay').style.display = 'none';
        }

        window.showHelp = showHelp;
        window.closeHelp = closeHelp;
    </script>
