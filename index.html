            if (view === 'detail' && state.detailSubject && detailFetchedSubjects.has(state.detailSubject)) {
                renderDetail();
            }
            // 右侧搜索框换视图后，重新同步左侧搜索框等宽
            syncSearchBoxWidths();
        }

        // 左侧三个榜单标签的宽度与右侧单个标签宽度保持一致(像素)，窗口尺寸/缩放变化时重新同步
        function syncLeftTabWidth() {
            const ref = document.querySelector('#right-tabs .panel-tab');
            const leftTabs = document.querySelectorAll('#left-tabs .panel-tab');
            if (ref && leftTabs.length > 0) {
                const w = ref.offsetWidth + 'px';
                leftTabs.forEach(function(tab) { tab.style.width = w; });
            }
        }

        // 详情页下部子标签页切换（制作人员 / 角色声优）
        // 点击原标签页表示退出人物搜索结果，回到当前作品的正常列表
        function switchDetailSubTab(sub) {
            if (sub !== 'staff' && sub !== 'cast') sub = 'cast';
            detailPersonSearchSeq++;
            state.detailSearchActive = false;
            state.detailSearchResults = null;
            state.detailSearchKeyword = '';
            const input = document.getElementById('detail-search-input');
            if (input) input.value = '';
            state.detailSearchScope = sub;
            syncDetailScopeUI();
            showDetailListTab(sub);
        }

        function detailScopeLabel(scope) {
            return scope === 'staff' ? '制作人员' : '角色声优';
        }

        // 底栏范围按钮/搜索框占位文字与 state.detailSearchScope 同步
        function syncDetailScopeUI() {
            const btn = document.getElementById('detail-scope-btn');
            if (btn) btn.innerText = detailScopeLabel(state.detailSearchScope);
            const input = document.getElementById('detail-search-input');
            if (input) {
                input.placeholder = state.detailSearchScope === 'cast'
                    ? '输入角色声优名称...' : '输入制作人员名称...';
            }
        }

        // 显示当前作品的普通列表（制作人员 / 角色声优），并隐藏人物搜索结果
        function showDetailListTab(sub) {
            if (sub !== 'staff' && sub !== 'cast') sub = 'cast';
            state.detailSubTab = sub;
            markActiveTab('.detail-subtab', 'sub', sub, 'active');
            const staffEl = document.getElementById('detail-staff');
            const castEl = document.getElementById('detail-cast');
            const resultsEl = document.getElementById('detail-person-results');
            const searching = state.detailSearchActive;
            staffEl.style.display = (!searching && sub === 'staff') ? 'block' : 'none';
            castEl.style.display = (!searching && sub === 'cast') ? 'block' : 'none';
            resultsEl.style.display = searching ? 'block' : 'none';
            // 制作人员区变为可见后，用真实宽度重新渲染（隐藏时 clientWidth 为 0 会导致误截断）
            if (!searching && sub === 'staff' && state.detailSubject && detailFetchedSubjects.has(state.detailSubject)) {
                renderStaffSection();
            }
        }

        // 清空详情页人物搜索/当前人物（切换作品、数据重载时调用）
        function resetDetailPersonState(clearMark) {
            detailPersonSearchSeq++;
            state.detailSearchActive = false;
            state.detailSearchResults = null;
            state.detailSearchKeyword = '';
            state.detailPerson = null;
            const input = document.getElementById('detail-search-input');
            if (input) input.value = '';
            const resultsEl = document.getElementById('detail-person-results');
            if (resultsEl) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; }
            if (clearMark) clearDetailMark();
            updateDetailMarkBtn();
            showDetailListTab(state.detailSubTab || 'cast');
        }

        // 恢复详情区：有"上一次展示的作品"时继续显示它，否则回到未选择占位
        function resetDetailView() {
            state.detailView = null;
            document.getElementById('detail-intro-back').style.display = 'none';
            document.getElementById('detail-intro-label').innerText = '介绍';
            if (state.detailSubject && getSelectedAnime()) {
                renderDetail();
                return;
            }
            // 无作品可展示时保持空白，不显示占位提示
            document.getElementById('detail-intro').innerHTML = '';
            document.getElementById('detail-staff').innerHTML = '';
            document.getElementById('detail-cast').innerHTML = '';
        }

        function renderDetailSections() {
            const anime = getSelectedAnime();
            const staffEl = document.getElementById('detail-staff');
            const castEl = document.getElementById('detail-cast');

            if (!anime) {
                staffEl.innerHTML = '';
                castEl.innerHTML = '';
                return;
            }

            // 1. 制作人员渲染
            renderStaffSection();

            // 2. 角色声优渲染
            if (anime.characters && anime.characters.length) {
                castEl.innerHTML = anime.characters.slice(0, 200).map(c => {
                    const vaIds = Array.isArray(c[1]) ? c[1] : (c[1] ? [c[1]] : []);
                    const mainVaId = vaIds[0] || '';
                    const mainVaName = getPersonName(mainVaId);
                    
                    const vaNamesHtml = vaIds.map(vaId => esc(getPersonName(vaId))).join(' / ');
                    
                    return `<div class="detail-cast-item" ${mainVaId ? `data-pid="${esc(mainVaId)}" data-pname="${esc(mainVaName)}" style="cursor:pointer;"` : ''}>` +
                        `<span class="detail-char">${esc(getCharacterName(c[0]))}</span>` +
                        (vaNamesHtml ? `<span class="detail-va-text">${vaNamesHtml}</span>` : '') +
                        `</div>`;
                }).join('');
            } else {
                castEl.innerHTML = '<div class="detail-empty">暂无角色</div>';
            }
        }

        // 制作人员渲染：超过一行宽度截断为可点击省略号，点击展开/收缩
        function renderStaffSection() {
            const staffEl = document.getElementById('detail-staff');
            const anime = getSelectedAnime();
            if (!anime || !(anime.staff && anime.staff.length)) {
                staffEl.innerHTML = '<div class="detail-empty">暂无制作人员</div>';
                return;
            }
            const staffGroups = {};
            anime.staff.slice().sort((a, b) => (a[2] || 0) - (b[2] || 0)).forEach(s => {
                const pos = s[1] || '—';
                if (!staffGroups[pos]) staffGroups[pos] = [];
                staffGroups[pos].push(s[0]);
            });
            const expandedSet = state.expandedStaffGroups || (state.expandedStaffGroups = new Set());
            // 固定单列渲染全文；省略号按钮通过真实像素测量(超出单行)决定显示，不受缩放影响
            staffEl.innerHTML = Object.entries(staffGroups).map(([pos, pids]) => {
                const expanded = expandedSet.has(pos);
                const personsHtml = pids.map(pid =>
                    `<span class="detail-person-name" data-pid="${esc(pid)}" data-pname="${esc(getPersonName(pid))}">${esc(getPersonName(pid))}</span>`
                ).join('、');
                return `<div class="detail-staff-group${expanded ? ' expanded' : ''}" data-pos="${esc(pos)}">` +
                       `<span class="detail-pos-label">【${esc(pos)}】</span>` +
                       `<span class="detail-persons">${personsHtml}</span>` +
                       `<span class="staff-group-toggle" data-pos="${esc(pos)}">…</span>` +
                       `</div>`;
            }).join('');

            // 实测判定：人名区内容宽度超过实际宽度(单行放不下)时显示省略号按钮；详情页隐藏时宽度为 0 不判定
            staffEl.querySelectorAll('.detail-staff-group').forEach(group => {
                const toggle = group.querySelector('.staff-group-toggle');
                const expanded = group.classList.contains('expanded');
                const personsEl = group.querySelector('.detail-persons');
                if (expanded || (staffEl.clientWidth > 0 && personsEl.scrollWidth > personsEl.clientWidth)) {
                    toggle.style.display = 'inline';
                }
            });
        }

        function toggleStaffGroup(pos) {
            const set = state.expandedStaffGroups || (state.expandedStaffGroups = new Set());
            if (set.has(pos)) set.delete(pos); else set.add(pos);
            renderStaffSection();
        }

        function workItemHtml(sid, a, extraSpans, prefix) {
            const watched = state.watched.has(sid);
            const extras = extraSpans.map(s => `<span class="${s.cls}">${esc(s.text)}</span>`).join('');
            return `<div class="detail-work">` +
                `<div class="detail-work-info">` +
                (prefix || '') +
                `<span class="detail-work-title" onclick="window.pywebview.api.open_url('https://bgm.tv/subject/${sid}')">${esc(a.title)}</span>` +
                extras +
                `</div>` +
                `<div class="detail-work-right">` +
                `<span class="detail-meta">${esc(a.date ? formatYM(a.date) : '—')}</span>` +
                `<span class="detail-watched${watched ? ' watched-yes' : ''}">${watched ? '已看' : '未看'}</span>` +
                `</div>` +
                `</div>`;
        }

        function renderDetailIntro() {
            const label = document.getElementById('detail-intro-label');
            const introEl = document.getElementById('detail-intro');
            const backBtn = document.getElementById('detail-intro-back');
            const anime = getSelectedAnime();
            const map = getDetailAnimeMap();

            const careerStaffMap = (state.detail && state.detail.career_staff) ? state.detail.career_staff : {};
            const careerVaMap = (state.detail && state.detail.career_va) ? state.detail.career_va : {};

            if (!anime) {
                label.innerText = '介绍';
                backBtn.style.display = 'none';
                introEl.innerHTML = `<div class="detail-empty">暂无详情数据</div>`;
                return;
            }

            const view = state.detailView;
            if (!view) {
                // 需求1：介绍栏标题显示当前作品标题
                label.innerText = anime.title;
                backBtn.style.display = 'none';
                // 需求1：标签显示在简介文字段落之前，合并到介绍内容中
                let html = '';
                if (anime.tags && anime.tags.length) {
                    html += `<div class="intro-tags-row">` +
                        anime.tags.slice(0, 60).map(t =>
                            `<span class="tag-chip" data-tag="${esc(t[0])}">${esc(t[0])} <em>${t[1]}</em></span>`).join('') +
                        `</div>`;
                }
                // 需求2：简介段落有翻译(标记[简介原文]/【原文】等)时不显示原文
                let summary = anime.summary || '';
                const m = summary.search(/[[【〔（(]\s*(?:简介)?原文\s*[\]】〕）)]/);
                if (m >= 0) summary = summary.slice(0, m).trim();
                html += summary
                    ? `<div class="detail-summary">${esc(summary)}</div>`
                    : '<div class="detail-empty">暂无简介</div>';
                introEl.innerHTML = html;
                return;
            }

            // 相关作品列表视图：显示返回按钮
            backBtn.style.display = '';
            if (view.type === 'tag') {
                const works = [];
                for (const sid in map) {
                    const a = map[sid];
                    if (a.tags && a.tags.some(t => t[0] === view.name)) works.push({ sid, a });
                }
                const tagWatched = (w) => state.watched.size === 0 || state.watched.has(w.sid);
                const byRank = (x, y) => x.a.rank - y.a.rank;
                const watchedTop = works.filter(tagWatched).sort(byRank).slice(0, 10);
                const unwatchedTop = works.filter(w => !tagWatched(w)).sort(byRank).slice(0, 10);
                const merged = watchedTop.concat(unwatchedTop).sort(byRank);
                label.innerText = `标签：${view.name}（${works.length}）`;
                introEl.innerHTML = merged.map(w => workItemHtml(w.sid, w.a, [
                    { cls: 'detail-meta', text: `排名 ${w.a.rank >= 999999 ? '—' : w.a.rank}` },
                    { cls: 'detail-meta', text: `评分 ${dash(w.a.score)}` }
                ])).join('');
                
            } else if (view.type === 'staff') {
                // 履历尚未拉取(点击处理中)：显示加载占位
                if (careerStaffMap[view.pid] === undefined) {
                    label.innerText = `制作人员：${view.name}`;
                    introEl.innerHTML = '<div class="detail-empty">加载中...</div>';
                    return;
                }
                const works = careerStaffMap[view.pid];
                const mergedWorksMap = new Map();
                
                for (const w of works) {
                    if (mergedWorksMap.has(w.sid)) {
                        mergedWorksMap.get(w.sid).pos.push(w.pos);
                    } else {
                        mergedWorksMap.set(w.sid, { ...w, pos: [w.pos] });
                    }
                }
                const uniqueWorks = Array.from(mergedWorksMap.values());
                uniqueWorks.sort((x, y) => (y.date || '').localeCompare(x.date || ''));
                
                label.innerText = `制作人员：${view.name}（${uniqueWorks.length}）`;
                introEl.innerHTML = uniqueWorks.map(w => {
                    const watched = state.watched.has(w.sid);
                    const posStr = Array.from(new Set(w.pos)).join(' + '); 
                    
                    return `<div class="detail-work">` +
                        `<div class="detail-work-info">` +
                        `<span class="detail-work-title" onclick="window.pywebview.api.open_url('https://bgm.tv/subject/${w.sid}')">${esc(w.title)}</span>` +
                        `<span class="detail-pos2">${esc(posStr)}</span>` +
                        `</div>` +
                        `<div class="detail-work-right">` +
                        `<span class="detail-meta">${esc(formatYM(w.date))}</span>` +
                        `<span class="detail-watched${watched ? ' watched-yes' : ''}">${watched ? '已看' : '未看'}</span>` +
                        `</div>` +
                        `</div>`;
                }).join('');
                
            } else if (view.type === 'va') {
                // 履历尚未拉取(点击处理中)：显示加载占位
                if (careerVaMap[view.pid] === undefined) {
                    label.innerText = `声优：${view.name}`;
                    introEl.innerHTML = '<div class="detail-empty">加载中...</div>';
                    return;
                }
                const roles = careerVaMap[view.pid];
                const uniqueRoles = [];
                const seenRoles = new Set();
                for (const r of roles) {
                    const key = r.sid + '_' + r.cid;
                    if (!seenRoles.has(key)) { seenRoles.add(key); uniqueRoles.push(r); }
                }
                uniqueRoles.sort((x, y) => (y.date || '').localeCompare(x.date || ''));
                
                label.innerText = `声优：${view.name}（${uniqueRoles.length}）`;
                introEl.innerHTML = uniqueRoles.map(r => {
                    const watched = state.watched.has(r.sid);
                    return `<div class="detail-work">` +
                        `<div class="detail-work-info">` +
                        `<span style="font-weight:bold; flex-shrink: 0;">${esc(getCharacterName(r.cid))}</span>` +
                        `<span class="detail-work-title" onclick="window.pywebview.api.open_url('https://bgm.tv/subject/${r.sid}')">${esc(r.title)}</span>` +
                        `</div>` +
                        `<div class="detail-work-right">` +
                        `<span class="detail-meta">${esc(formatYM(r.date))}</span>` +
                        `<span class="detail-watched${watched ? ' watched-yes' : ''}">${watched ? '已看' : '未看'}</span>` +
                        `</div>` +
                        `</div>`;
                }).join('');
                
            } else {
                label.innerText = anime.title;
                introEl.innerHTML = anime.summary
                    ? `<div class="detail-summary">${esc(anime.summary)}</div>`
                    : '<div class="detail-empty">暂无简介</div>';
            }
        }

        // 返回按钮：从相关作品列表(标签/制作人员/声优)返回作品介绍
        function backToIntro() {
            state.detailView = null;
            renderDetailIntro();
        }

        // 点击标签/制作人员/声优：介绍区显示相关作品列表，搜索框填入名称并进入关联搜索状态；
        // 不自动红框标注，由用户点击"搜索"按钮或回车后执行
        function fillSearchBox(name) {
            const inputEl = document.getElementById('search-input');
            inputEl.value = name;
            searchState.keyword = name.toLowerCase().trim();
        }

        function clickTag(tagName) {
            if (!getSelectedAnime()) return;
            state.detailView = { type: 'tag', name: tagName };
            renderDetailIntro();
            // 需求：已有红框标注时，先清除搜索框内容与表格标注恢复到搜索前状态，再填入新词条
            if (searchState.isActive) clearSearch();
            searchState.related = { type: 'tag', name: tagName };
            fillSearchBox(tagName);
        }

        // 按需拉取某制作人员/声优的履历(detail_extra)，结果写入内存后重复点击秒开
        async function ensurePersonCareers(pid) {
            pid = String(pid);
            if (state.detail.career_staff[pid] !== undefined) return;
            try {
                const resp = await api.getPersonCareers(pid);
                if (resp && resp.success) {
                    state.detail.career_staff[pid] = resp.staff || [];
                    state.detail.career_va[pid] = resp.va || [];
                    if (resp.characters) Object.assign(state.detail.characters, resp.characters);
                    return;
                }
            } catch {}
            state.detail.career_staff[pid] = [];
            state.detail.career_va[pid] = [];
        }

        // 详情页人物点击：显示其关联作品履历；选中名称回填右侧搜索框，标记改由底栏“标记/清除”按钮处理
        async function openDetailPerson(pid, name, scope) {
            if (!getSelectedAnime()) return;
            pid = String(pid);
            const type = scope === 'staff' ? 'staff' : 'va';
            state.detailSearchScope = type === 'staff' ? 'staff' : 'cast';
            syncDetailScopeUI();
            const searchInput = document.getElementById('detail-search-input');
            if (searchInput) searchInput.value = name;
            if (state.detailMark && state.detailMark.pid !== pid) clearDetailMark();
            state.detailPerson = { type, pid, name };
            state.detailView = { type, pid, name };
            renderDetailIntro();
            // 首次调用该人物履历：先显示加载占位，拉取完成后再渲染
            const cur = state.detailView;
            await ensurePersonCareers(pid);
            if (state.detailView === cur) renderDetailIntro();
            updateDetailMarkBtn();
        }

        async function clickStaff(pid, name) {
            return openDetailPerson(pid, name, 'staff');
        }

        async function clickVa(pid, name) {
            return openDetailPerson(pid, name, 'cast');
        }

        // ==================== 详情页底栏：人物搜索 / 标记 ====================
        function exitDetailSearchView() {
            detailPersonSearchSeq++;
            state.detailSearchActive = false;
            state.detailSearchResults = null;
            state.detailSearchKeyword = '';
        }

        // 底栏“制作人员/角色声优”按钮：切换搜索范围，并同步下部标签页
        function toggleDetailScope() {
            state.detailSearchScope = state.detailSearchScope === 'cast' ? 'staff' : 'cast';
            syncDetailScopeUI();
            const input = document.getElementById('detail-search-input');
            if (input && input.value.trim()) {
                runDetailPersonSearch();
            } else {
                exitDetailSearchView();
                showDetailListTab(state.detailSearchScope);
            }
        }

        // 在全库声优/制作人员中搜索相近名称，结果显示在下部区域。
        // 返回结果数组供标记按钮复用；无结果返回 []，被后续操作取代返回 null。
        async function runDetailPersonSearch() {
            const input = document.getElementById('detail-search-input');
            const keyword = input ? input.value.trim() : '';
            const scope = state.detailSearchScope;
            if (!keyword) {
                exitDetailSearchView();
                showDetailListTab(scope);
                return [];
            }
            const seq = ++detailPersonSearchSeq;
            state.detailSearchActive = true;
            state.detailSearchKeyword = keyword;
            state.detailSearchResults = null;
            state.detailSubTab = scope;
            markActiveTab('.detail-subtab', 'sub', scope, 'active');
            const staffEl = document.getElementById('detail-staff');
            const castEl = document.getElementById('detail-cast');
            const resultsEl = document.getElementById('detail-person-results');
            staffEl.style.display = 'none';
            castEl.style.display = 'none';
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = '<div class="detail-empty">搜索中...</div>';
            let resp = null;
            try {
                resp = await api.searchPersons(keyword, scope);
            } catch (e) {
                resp = { error: String(e) };
            }
            // 期间切换了范围/关键词/作品：丢弃过期结果
            if (seq !== detailPersonSearchSeq || state.detailSearchScope !== scope) return null;
            if (input && input.value.trim() !== keyword) return null;
            if (resp && resp.success) {
                state.detailSearchResults = resp.results || [];
                renderDetailPersonResults();
                return state.detailSearchResults;
            } else {
                state.detailSearchResults = [];
                resultsEl.innerHTML = `<div class="detail-empty">${esc((resp && resp.error) || '搜索失败')}</div>`;
                return [];
            }
        }

        function renderDetailPersonResults() {
            const resultsEl = document.getElementById('detail-person-results');
            if (!resultsEl) return;
            const results = state.detailSearchResults || [];
            const isCast = state.detailSearchScope === 'cast';
            const label = isCast ? '角色声优' : '制作人员';
            if (!results.length) {
                resultsEl.innerHTML = `<div class="detail-empty">未找到相近的${label}</div>`;
                return;
            }
            let html = `<div class="detail-results-head">找到 ${results.length} 位相近的${label}（点击查看作品）</div>`;
            results.forEach(r => {
                html += `<div class="detail-person-result" data-pid="${esc(r.pid)}" data-pname="${esc(r.name)}" data-ptype="${isCast ? 'va' : 'staff'}">` +
                    `<span class="detail-person-name-text">${esc(r.name)}</span>` +
                    `<span class="detail-person-count">${r.count} 部作品</span>` +
                    `</div>`;
            });
            resultsEl.innerHTML = html;
        }

        function clearDetailMarkClasses() {
            const sel = '.detail-mark-title, .detail-mark-icon, .detail-mark-support-title, .detail-mark-support-icon';
            const classes = ['detail-mark-title', 'detail-mark-icon', 'detail-mark-support-title', 'detail-mark-support-icon'];
            document.querySelectorAll(sel).forEach(el => el.classList.remove(...classes));
            // 离屏缓存 tbody 也可能残留旧类，需一并清理
            ['rank', 'rating', 'collect'].forEach(k => {
                const node = viewTableCache[k] && viewTableCache[k].node;
                if (node) node.querySelectorAll(sel).forEach(el => el.classList.remove(...classes));
            });
        }

        // 只在当前换入的表格 DOM 上画详情页标记红框，返回命中数量
        function applyDetailMarkClasses() {
            if (!state.detailMark) return 0;
            clearDetailMarkClasses();
            let count = 0;
            const ids = state.detailMark.ids;
            const mainIds = state.detailMark.mainIds || ids;
            const supportIds = state.detailMark.supportIds || new Set();
            document.querySelectorAll('#rank-table-body td.title-col[data-sid]').forEach(cell => {
                const sid = cell.dataset.sid;
                if (!ids.has(sid)) return;
                const icon = cell.nextElementSibling;
                if (mainIds.has(sid)) {
                    cell.classList.add('detail-mark-title');
                    if (icon && icon.classList.contains('icon-col')) icon.classList.add('detail-mark-icon');
                } else if (supportIds.has(sid)) {
                    cell.classList.add('detail-mark-support-title');
                    if (icon && icon.classList.contains('icon-col')) icon.classList.add('detail-mark-support-icon');
                }
                count++;
            });
            return count;
        }

        function updateDetailMarkBtn() {
            const btn = document.getElementById('detail-mark-btn');
            if (btn) btn.innerText = state.detailMark ? '清除' : '标记';
        }

        function clearDetailMark() {
            state.detailMark = null;
            clearDetailMarkClasses();
            updateDetailMarkBtn();
            updateMarkIndicator();
        }

        // 标记的自动切榜：按当前名次窗口/年份范围/隐藏项判断哪张榜会显示该人物的作品
        function findDetailMarkView(ids) {
            const colCount = rankColCount();
            for (const view of VIEWS) {
                for (const g of getEffectiveGroups(view, true)) {
                    const animes = prepareGroupAnimes(g[1], isFutureGroup(g));
                    for (let i = 0; i < colCount && i < animes.length; i++) {
                        if (ids.has(String(animes[i].subject_id))) return view;
                    }
                }
            }
            return null;
        }

        // 人物标记集合：声优按角色类型拆分主角（实线）与非主角（虚线）；制作人员全部实线
        function buildPersonMarkSets(person) {
            const main = new Set();
            const support = new Set();
            if (person.type === 'va') {
                ((state.detail.career_va || {})[person.pid] || []).forEach(r => {
                    const sid = String(r.sid);
                    const rt = Number(r.role_type) || 0;
                    // 1=主角；0=旧数据/未知（按原行为实线）；其余（配角/客串/闲角/旁白等）统一虚线
                    if (rt === 1 || rt === 0) main.add(sid);
                    else support.add(sid);
                });
                // 同一作品同时有主角与其他角色：主角实线优先
                support.forEach(sid => { if (main.has(sid)) support.delete(sid); });
            } else {
                ((state.detail.career_staff || {})[person.pid] || []).forEach(w => {
                    main.add(String(w.sid));
                });
            }
            const ids = new Set([...main, ...support]);
            return { main, support, ids };
        }

        // 人物名称归一化：忽略空格/大小写，用于判断搜索框内容与当前人物是否一致
        function normalizePersonName(value) {
            return String(value || '').replace(/\s+/g, '').toLowerCase();
        }

        // 标记按钮解析：优先使用与搜索框同名且同范围的当前人物；
        // 否则按搜索框内容搜索并取第一个结果（若已有同关键词结果则直接复用）
        async function resolveDetailMarkPerson() {
            const input = document.getElementById('detail-search-input');
            const keyword = input ? input.value.trim() : '';
            const scope = state.detailSearchScope;
            const expectedType = scope === 'cast' ? 'va' : 'staff';
            const current = state.detailPerson;
            if (!keyword) return current || null;
            if (current && current.type === expectedType
                && normalizePersonName(current.name) === normalizePersonName(keyword)) {
                return current;
            }
            let results = null;
            if (state.detailSearchActive && state.detailSearchResults
                && normalizePersonName(state.detailSearchKeyword) === normalizePersonName(keyword)) {
                results = state.detailSearchResults;
            } else {
                results = await runDetailPersonSearch();
            }
            if (!results || !results.length) {
                // null 表示本次搜索被后续输入/范围变化取代，标记动作直接放弃
                return results === null ? undefined : null;
            }
            const first = results[0];
            await openDetailPerson(first.pid, first.name, scope);
            return state.detailPerson;
        }

        // 标记/清除：标记当前人物全部关联作品，独立于左侧搜索框与左侧搜索红框
        async function toggleDetailMark() {
            if (state.detailMark) { clearDetailMark(); return; }
            const input = document.getElementById('detail-search-input');
            const keyword = input ? input.value.trim() : '';
            const person = await resolveDetailMarkPerson();
            if (person === undefined) return; // 搜索被新的输入/范围变化取代
            if (!person) {
                if (keyword) {
                    const label = state.detailSearchScope === 'cast' ? '角色声优' : '制作人员';
                    showStyledModal('标记', [`未找到与「${keyword}」相近的${label}。`]);
                } else {
                    showStyledModal('标记', ['请输入名称，或先在下方的搜索结果中选择一位制作人员/角色声优。']);
                }
                return;
            }
            await ensurePersonCareers(person.pid);
            const sets = buildPersonMarkSets(person);
            const ids = sets.ids;
            if (!ids.size) {
                showStyledModal('标记', [`未找到「${person.name}」的关联作品。`]);
                return;
            }
            const target = findDetailMarkView(ids);
            if (!target) {
                showStyledModal('标记', [`「${person.name}」的关联作品不在当前显示范围（年份/名次/隐藏项目）内。`]);
                return;
            }
            // 两种标记互斥：开始详情页人物标记前，先清除左侧作品搜索标记
            if (searchState.isActive) clearSearch();
            state.detailMark = {
                type: person.type, pid: person.pid, name: person.name,
                ids: ids, mainIds: sets.main, supportIds: sets.support
            };
            updateDetailMarkBtn();
            updateMarkIndicator();
            const select = document.getElementById('view-select');
            if (select.value !== target) {
                select.value = target;
                syncGradeByView();
                renderTable();
            } else {
                applyDetailMarkClasses();
            }
        }

        window.selectAnime = selectAnime;
        window.clickTag = clickTag;
        window.clickStaff = clickStaff;
        window.clickVa = clickVa;
        window.switchDetailSubTab = switchDetailSubTab;
        window.toggleWatchedStatus = toggleWatchedStatus;
        window.toggleWeekdayCollapse = toggleWeekdayCollapse;
        window.togglePlanSection = togglePlanSection;
        window.removePlanCard = removePlanCard;
        window.planCardDragStart = planCardDragStart;
        window.planSectionDragStart = planSectionDragStart;
        window.editUpdateTime = editUpdateTime;
        window.searchState = searchState;
        window.executeSearchHighlight = executeSearchHighlight;
        window.searchContinueJump = searchContinueJump;
        window.scrollToCurrentMatch = scrollToCurrentMatch;
        window.syncSelectedRowHighlight = syncSelectedRowHighlight;
        window.state = state;

        // ==================== 评级格自定义悬浮提示 ====================
        // 替换浏览器原生 title(有延迟且不可定制)：鼠标进入评级格立即显示；
        // 悬浮层固定于所在行"作品名格+评级格"下方，宽度与两格总宽一致，下方空间不足时转上方
        let iconTipEl = null;
        let iconTipTd = null;

        function getIconTipEl() {
            if (!iconTipEl) {
                iconTipEl = document.createElement('div');
                iconTipEl.className = 'custom-tip';
                iconTipEl.style.display = 'none';
                document.body.appendChild(iconTipEl);
            }
            return iconTipEl;
        }

        function iconTipVisible() {
            return !!(iconTipEl && iconTipEl.style.display !== 'none');
        }

        // 评级格与其左侧作品名格组成的矩形(水平范围即两格总宽)
        function iconTipAnchorRect(td) {
            const titleCell = td.previousElementSibling;
            const rTitle = titleCell && titleCell.classList.contains('title-col')
                ? titleCell.getBoundingClientRect() : td.getBoundingClientRect();
            const rIcon = td.getBoundingClientRect();
            return {
                top: Math.min(rTitle.top, rIcon.top),
                bottom: Math.max(rTitle.bottom, rIcon.bottom),
                left: Math.min(rTitle.left, rIcon.left),
                width: Math.max(rTitle.right, rIcon.right) - Math.min(rTitle.left, rIcon.left)
            };
        }

        // 作品名格与评级格同为触发区：任一格内悬停都取其后(或本身)带 data-tip 的评级格作为锚定格
        function iconTipPairOf(td) {
            const iconTd = td.classList.contains('icon-col')
                ? td
                : (td.nextElementSibling && td.nextElementSibling.classList.contains('icon-col')
                    ? td.nextElementSibling : null);
            return iconTd && iconTd.hasAttribute('data-tip') ? iconTd : null;
        }

        // 相关目标是否仍停留在"作品名格+评级格"触发区内(跨格移动不闪断)
        function iconTipPairContains(iconTd, node) {
            if (!node) return false;
            if (iconTd === node || iconTd.contains(node)) return true;
            const titleTd = iconTd.previousElementSibling;
            return !!(titleTd && titleTd.classList.contains('title-col') && (titleTd === node || titleTd.contains(node)));
        }

        // 二字标签中间补一个全角空格(占一字宽)：首字保持左对齐，末字与三字标签的末字同一竖线
        function padTipLabel(text) {
            return text.length === 2 ? text[0] + '\u3000' + text[1] : text;
        }

        // 六维面板维度定义（顺时针，排名在正上方；标准差在面板中显示为“争议度”）
        // idx 指向 data-pcts / 统计均值数组的规范顺序 [排名,评分,评分数,标准差,热度,推荐度]
        const RADAR_AXES = [
            { name: '排名', idx: 0 }, { name: '评分', idx: 1 }, { name: '一致度', idx: 3 },
            { name: '评分数', idx: 2 }, { name: '热度', idx: 4 }, { name: '推荐度', idx: 5 }
        ];
        // 前X% -> 21 级：S+(1) S(2-5) S-(6-10) A+(11-15) A(16-20) ... F-(96-100)
        const RADAR_GRADES = ['S+', 'S', 'S-', 'A+', 'A', 'A-', 'B+', 'B', 'B-',
                              'C+', 'C', 'C-', 'D+', 'D', 'D-', 'E+', 'E', 'E-', 'F+', 'F', 'F-'];
        function gradeOfPct(pct) {
            if (pct == null || pct <= 0) return '—';
            if (pct <= 1) return 'S+';
            if (pct <= 5) return 'S';
            if (pct <= 10) return 'S-';
            return RADAR_GRADES[Math.min(RADAR_GRADES.length - 1, 3 + Math.floor((pct - 11) / 5))];
        }

        // 六维面板图：只显示名称与等级(无数值)。连续半径 = R1 × (100 - 前X%)/100；
        // 缺失维等级为“—”、不产生顶点；有效顶点 < 3 时不绘制多边形。
        // 网格 3 层六边形 + 3 个同心圆；维度名称环绕圆形、等级正向排布。
        // ===== 悬停框入场动画：0.5s 数字 0→实际值、六维图 50%→实际（面板本身立刻显示） =====
        // 数字节点用 data-count(目标值)/data-fmt('int'|'num3')/data-suffix 标记
        function fmtCountValue(v, fmt) {
            return fmt === 'num3' ? fmtNum3(v) : String(Math.round(v));
        }

        function tagNumber(node, value, fmt, suffix) {
            const v = Number(value);
            if (!isFinite(v)) return;
            node.setAttribute('data-count', String(v));
            node.setAttribute('data-fmt', fmt || 'int');
            node.setAttribute('data-suffix', suffix || '');
            node.textContent = fmtCountValue(v, fmt) + (suffix || '');
        }

        // 底栏数字：specs = [[值, 后缀, 格式], ...]，用 " | " 分隔；缺失显示 —
        function appendFooterNumbers(foot, specs) {
            specs.forEach((sp, i) => {
                if (i) {
                    // 分隔符用独立 span + 左右内边距：flex 布局里文本节点的首尾空格会被裁掉，
                    // 直接写 " | " 只会显示成 "|"
                    const sep = document.createElement('span');
                    sep.className = 'tip-panel-sep';
                    sep.textContent = '|';
                    foot.appendChild(sep);
                }
                const node = document.createElement('span');
                if (sp[0] != null && String(sp[0]) !== '' && isFinite(Number(sp[0]))) {
                    tagNumber(node, sp[0], sp[2], sp[1]);
                } else {
                    node.textContent = '—';
                }
                foot.appendChild(node);
            });
        }

        // 中断该元素上未完成的入场动画（数字计数/六维图）
        function stopTipAnim(el) {
            if (!el) return;
            if (el._tipRaf) { cancelAnimationFrame(el._tipRaf); el._tipRaf = null; }
        }

        function startTipEnter(el) {
            stopTipAnim(el);
            const nums = Array.from(el.querySelectorAll('[data-count]')).map(node => ({
                node: node,
                v: Number(node.getAttribute('data-count')),
                fmt: node.getAttribute('data-fmt') || 'int',
                suffix: node.getAttribute('data-suffix') || '',
                final: node.textContent
            }));
            const poly = el.querySelector('polygon.radar-area');
            if (poly && poly._setProgress) poly._setProgress(0);
            const DUR = 500, t0 = performance.now();
            const step = now => {
                const t = Math.min(1, (now - t0) / DUR);
                const e = 1 - Math.pow(1 - t, 3);
                nums.forEach(it => { it.node.textContent = fmtCountValue(it.v * e, it.fmt) + it.suffix; });
                if (poly && poly._setProgress) poly._setProgress(e);
                if (t < 1) {
                    el._tipRaf = requestAnimationFrame(step);
                } else {
                    el._tipRaf = null;
                    nums.forEach(it => { it.node.textContent = it.final; });
                    if (poly && poly._setProgress) poly._setProgress(1);
                }
            };
            el._tipRaf = requestAnimationFrame(step);
        }

        // 六维图（作品/统计通用）：按 data-pcts 的"前X%"绘制
        function buildRadarGraph(td) {
            const pcts = (td.dataset.pcts || '').split(',').map(s => s === '' ? null : parseInt(s, 10));
            return buildRadarFromPcts(pcts);
        }

        // 作品提示底栏：排名 | 评分 | 热度
        function buildWorkTipFooter(td) {
            const raw = (td.dataset.raw || '').split(',');
            const foot = document.createElement('div');
            foot.className = 'tip-panel-footer';
            appendFooterNumbers(foot, [[raw[0], '名', 'int'], [raw[1], '分', 'num3'], [raw[2], '热度', 'int']]);
            return foot;
        }

        // 带符号数字：正数 +、负数 -、0 不带符号
        function signedNumberText(v, digits) {
            const n = Number(v);
            if (!isFinite(n)) return '—';
            const abs = digits ? Math.abs(n).toFixed(digits) : String(Math.abs(Math.round(n)));
            if (n > 0) return '+' + abs;
            if (n < 0) return '-' + abs;
            return abs;
        }

        // 周对比底栏：评分变动 + 热度增长（绝对人数），始终位于提示框最下方
        function appendWeeklyMetric(foot, label, value, digits, zeroText) {
            const metric = document.createElement('span');
            metric.className = 'tip-weekly-metric';
            const labelEl = document.createElement('span');
            labelEl.className = 'tip-weekly-label';
            labelEl.textContent = label;
            metric.appendChild(labelEl);

            const n = Number(value);
            if (!isFinite(n)) {
                const empty = document.createElement('span');
                empty.className = 'tip-weekly-empty';
                empty.textContent = '—';
                metric.appendChild(empty);
                foot.appendChild(metric);
                return;
            }
            const factor = digits ? 100 : 1;
            const rounded = Math.round(n * factor) / factor;
            if (rounded === 0) {
                const zero = document.createElement('span');
                zero.className = 'tip-weekly-zero';
                zero.textContent = zeroText;
                metric.appendChild(zero);
                foot.appendChild(metric);
                return;
            }
            const valueEl = document.createElement('span');
            valueEl.className = 'tip-weekly-value';
            const sign = document.createElement('span');
            sign.className = 'tip-weekly-sign';
            sign.textContent = rounded > 0 ? '+' : '-';
            valueEl.appendChild(sign);
            const num = document.createElement('span');
            num.className = 'tip-weekly-number';
            tagNumber(num, Math.abs(rounded), digits ? 'num3' : 'int', '');
            valueEl.appendChild(num);
            metric.appendChild(valueEl);
            foot.appendChild(metric);
        }

        function buildWeeklyFooter(scoreDelta, popDelta, popPct, prevPop, prevScore) {
            const foot = document.createElement('div');
            foot.className = 'tip-weekly-footer';
            const title = document.createElement('span');
            title.className = 'tip-weekly-title';
            title.textContent = '较上周';
            foot.appendChild(title);
            appendWeeklyMetric(foot, '评分', scoreDelta, 2, '不变');
            appendWeeklyMetric(foot, '热度', popDelta, 0, '不增');
            const tips = [];
            if (scoreDelta != null && prevScore != null) {
                const rounded = Math.round(Number(scoreDelta) * 100) / 100;
                tips.push(rounded === 0 ? '评分不变'
                    : `评分 ${fmtNum3(prevScore)} → ${fmtNum3(Number(prevScore) + rounded)}`);
            }
            if (popDelta != null) {
                if (Math.round(Number(popDelta)) === 0) {
                    tips.push('热度不增');
                } else {
                    let s = `热度 ${signedNumberText(popDelta, 0)} 人`;
                    if (popPct != null) s += `（${signedNumberText(popPct, 1)}%）`;
                    tips.push(s);
                }
            }
            if (tips.length) foot.title = tips.join('；');
            return foot;
        }

        function buildWorkWeeklyFooter(td) {
            const p = (td.dataset.weekly || '').split(',');
            const num = i => (p[i] !== undefined && p[i] !== '') ? Number(p[i]) : null;
            return buildWeeklyFooter(num(0), num(1), num(2), num(3), num(4));
        }

        // 统计提示的周对比：评分取平均，热度取区间内总增长/总增长率
        function buildStatsWeeklyFooter(items) {
            let scoreSum = 0, scoreN = 0;
            let popDelta = null, prevPopSum = 0, hasPrevPop = false;
            items.forEach(a => {
                if (a.score_delta != null && isFinite(Number(a.score_delta))) {
                    scoreSum += Number(a.score_delta);
                    scoreN++;
                }
                if (a.pop_delta != null && isFinite(Number(a.pop_delta))) {
                    popDelta = (popDelta || 0) + Number(a.pop_delta);
                    if (a.prev_pop != null) {
                        prevPopSum += Number(a.prev_pop);
                        hasPrevPop = true;
                    }
                }
            });
            const avgScore = scoreN ? scoreSum / scoreN : null;
            const pct = (popDelta != null && hasPrevPop && prevPopSum > 0)
                ? popDelta * 100.0 / prevPopSum : null;
            return buildWeeklyFooter(avgScore, popDelta, pct, hasPrevPop ? prevPopSum : null, null);
        }

        // 作品详细数据：data-tip 行格式为 "标签: 值 (前X%)"；标签首字左对齐、末字对齐，
        // 数值紧随标签，百分比(去括号)单独右列
        function buildWorkDataGrid(td) {
            const grid = document.createElement('div');
            grid.className = 'custom-tip-rows';
            td.dataset.tip.split('\n').forEach(line => {
                const m = line.match(/^(.+?): (.*?)(?: \((前\d+%)\))?$/);
                const info = document.createElement('span');
                info.className = 'tip-info';
                const label = document.createElement('span');
                label.className = 'tip-label';
                label.textContent = m ? padTipLabel(m[1]) + ':' : line;
                const value = document.createElement('span');
                value.className = 'tip-value';
                if (m && /^\d+(\.\d+)?$/.test(m[2])) {
                    tagNumber(value, m[2], m[2].indexOf('.') >= 0 ? 'num3' : 'int', '');
                } else {
                    value.textContent = m ? m[2] : '';
                }
                info.appendChild(label);
                info.appendChild(value);
                const pct = document.createElement('span');
                pct.className = 'tip-pct';
                const pctText = m && m[3] ? m[3] : '';
                // "前X%"：前缀/数字(固定宽度,右对齐)/后缀拆分，数字在中间占固定宽度
                const pm = pctText.match(/^(前)(\d+)(%)$/);
                if (pm) {
                    const pre = document.createElement('span');
                    pre.className = 'tip-pct-pre';
                    pre.textContent = pm[1];
                    const num = document.createElement('span');
                    num.className = 'tip-pct-num';
                    tagNumber(num, pm[2], 'int', '');
                    const suf = document.createElement('span');
                    suf.className = 'tip-pct-suf';
                    suf.textContent = pm[3];
                    pct.appendChild(pre);
                    pct.appendChild(num);
                    pct.appendChild(suf);
                } else {
                    pct.textContent = pctText;
                }
                grid.appendChild(info);
                grid.appendChild(pct);
            });
            return grid;
        }

        // 当前提示组合键：六维/详细两个开关的二进制组合
        function tipCompositeKey() {
            return `${state.tipRadar ? '1' : '0'}${state.tipDetail ? '1' : '0'}`;
        }

        // 由六维"前X%"数组绘制面板图（作品悬停与统计悬停共用）
        function buildRadarFromPcts(pcts) {
            const wrap = document.createElement('div');
            wrap.className = 'tip-radar';
            const SIZE = 198, C = SIZE / 2;                  // 绘图坐标系(仅用于几何计算，实际显示尺寸由 viewBox 与容器决定)
            const S = 15;                                    // 半径间距：六边形每层间距 = 同心圆每层间距
            const R1 = 3 * S, R2 = R1 + S, R3 = R1 + 2 * S;  // 45 / 60 / 75（R1 = 最外层网格同半径；较原 4 圈整体缩小一圈）
            const MID_N = (R2 + R3) / 2;                     // 维度名称环中线
            const MID_G = (R1 + R2) / 2;                     // 等级环中线
            const CAP_HALF = 4.0;                            // 名称基线偏移(半字高，11px 约 4px)
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            const VB = 2 * R3 + 8;                           // 视图窗口紧贴图形(四周各留 4px)，避免图形被面板宽度缩小
            svg.setAttribute('viewBox', `${C - VB / 2} ${C - VB / 2} ${VB} ${VB}`);
            svg.setAttribute('width', SIZE);
            svg.setAttribute('height', SIZE);
            const pt = (i, r) => {
                const a = (-90 + i * 60) * Math.PI / 180;
                return [C + r * Math.cos(a), C + r * Math.sin(a)];
            };
            // 3 层同心六边形网格（层间距 = 同心圆间距 S）
            [1, 2, 3].forEach(k => {
                const pts = [];
                for (let i = 0; i < 6; i++) pts.push(pt(i, S * k).map(n => n.toFixed(1)).join(','));
                const pg = document.createElementNS(ns, 'polygon');
                pg.setAttribute('points', pts.join(' '));
                pg.setAttribute('class', 'radar-grid');
                svg.appendChild(pg);
            });
            // 6 条辐条
            for (let i = 0; i < 6; i++) {
                const [x, y] = pt(i, R1);
                const ln = document.createElementNS(ns, 'line');
                ln.setAttribute('x1', C); ln.setAttribute('y1', C);
                ln.setAttribute('x2', x.toFixed(1)); ln.setAttribute('y2', y.toFixed(1));
                ln.setAttribute('class', 'radar-grid');
                svg.appendChild(ln);
            }
            // 三个同心圆（最外层网格同半径圆 + 两个更大的同心圆），间距同为 S
            [R1, R2, R3].forEach((r, idx) => {
                const c = document.createElementNS(ns, 'circle');
                c.setAttribute('cx', C); c.setAttribute('cy', C); c.setAttribute('r', r);
                // 最外圈圆加粗到与面板多边形描边一致
                c.setAttribute('class', idx === 2 ? 'radar-grid radar-ring radar-outer' : 'radar-grid radar-ring');
                svg.appendChild(c);
            });
            // 数据多边形：仅连接有效顶点，少于 3 个有效顶点则不绘制；
            // 入场动画时各轴从 50% 过渡到实际前X%（前X% 越小半径越大）
            const validAxes = [];
            for (let i = 0; i < 6; i++) {
                const p = pcts[RADAR_AXES[i].idx];
                if (p != null && p > 0) validAxes.push({ i: i, p: p });
            }
            if (validAxes.length >= 3) {
                const pointsAt = t => validAxes.map(a => {
                    const p = 50 + (a.p - 50) * t;
                    return pt(a.i, R1 * (100 - Math.min(100, p)) / 100);
                }).map(v => v.map(n => n.toFixed(1)).join(',')).join(' ');
                const poly = document.createElementNS(ns, 'polygon');
                poly.setAttribute('points', pointsAt(1));
                poly.setAttribute('class', 'radar-area');
                poly._setProgress = t => poly.setAttribute('points', pointsAt(t));
                svg.appendChild(poly);
            }
            // 维度名称：环绕圆形文字（上半顺时针、下半逆时针 => 上三底部朝内圆、下三底部朝外圆）
            for (let i = 0; i < 6; i++) {
                const a = (-90 + i * 60) * Math.PI / 180;
                const upper = Math.sin(a) < 0;
                // 名称环半径：上半文字画在基线上方、下半画在基线下方，各偏移半字高使文字居中于两圆之间
                const RN = MID_N + (upper ? -CAP_HALF : CAP_HALF);
                const half = 0.33;
                const a1 = a - half, a2 = a + half;
                const p1 = [C + RN * Math.cos(a1), C + RN * Math.sin(a1)];
                const p2 = [C + RN * Math.cos(a2), C + RN * Math.sin(a2)];
                const arcId = 'radarArc' + i;
                const path = document.createElementNS(ns, 'path');
                if (upper) {
                    path.setAttribute('d', `M ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A ${RN} ${RN} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`);
                } else {
                    path.setAttribute('d', `M ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} A ${RN} ${RN} 0 0 0 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`);
                }
                path.setAttribute('id', arcId);
                path.setAttribute('fill', 'none');
                svg.appendChild(path);
                const tx = document.createElementNS(ns, 'text');
                tx.setAttribute('class', 'radar-axis');
                const tp = document.createElementNS(ns, 'textPath');
                tp.setAttribute('href', '#' + arcId);
                tp.setAttribute('startOffset', '50%');
                tp.setAttribute('text-anchor', 'middle');
                tp.textContent = RADAR_AXES[i].name;
                tx.appendChild(tp);
                svg.appendChild(tx);
            }
            // 等级：正向(水平)排布于第二层与第三层圆之间
            for (let i = 0; i < 6; i++) {
                const [x, y] = pt(i, MID_G);
                const tx = document.createElementNS(ns, 'text');
                tx.setAttribute('x', x.toFixed(1));
                tx.setAttribute('y', y.toFixed(1));
                tx.setAttribute('dy', '0.35em');
                tx.setAttribute('text-anchor', 'middle');
                tx.setAttribute('class', 'radar-grade');
                tx.textContent = gradeOfPct(pcts[RADAR_AXES[i].idx]);
                svg.appendChild(tx);
            }
            wrap.appendChild(svg);
            return wrap;
        }

        function showIconTip(td, force) {
            const el = getIconTipEl();
            const key = tipCompositeKey();
            // 同一格重复触发(鼠标在格子子元素间移动、键盘导航的兜底重显示)：只重定位，
            // 不重建内容，避免打断尚未播完的入场动画
            if (!force && iconTipVisible() && iconTipTd === td && el.dataset.tipKey === key) {
                positionIconTip();
                return;
            }
            const prevTd = iconTipTd;
            const wasVisible = iconTipVisible();
            hideStatsTip();
            hideWatchTip();
            const showRadar = state.tipRadar;
            const showDetail = state.tipDetail;
            // 所有组合统一使用无外层内边距的容器：详细数据区自身保留固定 6px 内边距，
            // 保证“仅详细数据”与“六维 + 详细”排版一致
            el.classList.add('tip-panel');
            el.classList.toggle('footer-only', !showRadar && !showDetail);
            el.classList.toggle('tip-combined', showRadar && showDetail);
            el.dataset.tipKey = key;
            el.textContent = '';
            if (showRadar) el.appendChild(buildRadarGraph(td));
            if (showDetail) {
                const block = document.createElement('div');
                block.className = 'tip-data-block';
                block.appendChild(buildWorkDataGrid(td));
                el.appendChild(block);
            }
            // 详细数据关闭时保留六维底栏（仅六维 / 两者均关两种情况）
            if (!showDetail) el.appendChild(buildWorkTipFooter(td));
            // 周对比底栏：四种组合永远显示在最下方
            el.appendChild(buildWorkWeeklyFooter(td));
            el.style.display = 'block';
            iconTipTd = td;
            positionIconTip();
            if (!wasVisible || prevTd !== td) startTipEnter(el);
        }

        /* 只显示在表格可视区内(不含滚动条)：超出部分裁掉；完全离开表格则不显示 */
        function clipTipToTable(el, anchor) {
            const box = (anchor && anchor.closest('.table-container')) || document.querySelector('.table-container');
            if (!box) return;
            const r = box.getBoundingClientRect();
            // 四周内缩 1px：消除粘性表头像素对齐与 clip-path 取整在表格外缘留下的 1px 透出缝
            const area = {
                left: r.left + box.clientLeft + 1,
                top: r.top + box.clientTop + 1,
                right: r.left + box.clientLeft + box.clientWidth - 1,
                bottom: r.top + box.clientTop + box.clientHeight - 1
            };
            const p = el.getBoundingClientRect();
            if (p.right <= area.left || p.left >= area.right || p.bottom <= area.top || p.top >= area.bottom) {
                el.style.visibility = 'hidden';
                return;
            }
            el.style.visibility = '';
            const t = Math.max(0, area.top - p.top);
            const rr = Math.max(0, p.right - area.right);
            const b = Math.max(0, p.bottom - area.bottom);
            const l = Math.max(0, area.left - p.left);
            el.style.clipPath = (t || rr || b || l) ? `inset(${t}px ${rr}px ${b}px ${l}px)` : '';
        }
        function positionIconTip() {
            if (!iconTipVisible() || !iconTipTd) return;
            const el = iconTipEl;
            const rect = iconTipAnchorRect(iconTipTd);
            // 两种模式悬停框宽度统一固定 160px
            const w = 160;
            el.style.width = w + 'px';
            // 居中对齐：以"作品名格 + 评级格"整体水平中心为准（数据/面板模式一致）；不做窗口边界夹紧，超出部分由 clipTipToTable 裁剪
            let left = Math.round(rect.left + rect.width / 2 - w / 2);
            el.style.left = left + 'px';
            const h = el.offsetHeight;
            // 按表格区域的可见下边界判断：格下空间能放下则在下，否则转上方
            const box = iconTipTd.closest('.table-container');
            const areaBottom = box ? box.getBoundingClientRect().bottom : window.innerHeight;
            const belowSpace = areaBottom - rect.bottom;
            if (belowSpace >= h) {
                el.style.top = rect.bottom + 'px';
            } else {
                el.style.top = (rect.top - h) + 'px';
            }
            clipTipToTable(el, iconTipTd);
        }

        function hideIconTip() {
            iconTipTd = null;
            if (iconTipEl) { stopTipAnim(iconTipEl); iconTipEl.style.display = 'none'; }
        }

        // ==================== 表头/季度/年份统计悬浮提示 ====================
        // 样式与作品悬浮框一致；数据范围 = 当前表格实际显示的作品
        let statsTipEl = null;
        let statsTipCell = null;

        function getStatsTipEl() {
            if (!statsTipEl) {
                statsTipEl = document.createElement('div');
                statsTipEl.className = 'custom-tip';
                statsTipEl.style.display = 'none';
                document.body.appendChild(statsTipEl);
            }
            return statsTipEl;
        }

        function statsTipVisible() {
            return !!(statsTipEl && statsTipEl.style.display !== 'none');
        }

        // sid -> 作品(三榜去重)映射缓存，按表格数据版本(tableEpoch)失效
        let statsItemMap = null;
        let statsItemEpoch = -1;
        function getStatsItemMap() {
            if (statsItemMap && statsItemEpoch === tableEpoch) return statsItemMap;
            const map = new Map();
            for (const view of ['rank', 'rating', 'collect']) {
                for (const g of state.data[view] || []) {
                    for (const a of g[1] || []) {
                        const sid = String(a.subject_id);
                        if (!map.has(sid)) map.set(sid, a);
                    }
                }
            }
            statsItemMap = map;
            statsItemEpoch = tableEpoch;
            return map;
        }

        // 把显示的 title-col 单元格换算为作品列表(去重)
        function statsItemsFromCells(cells) {
            const map = getStatsItemMap();
            const items = [];
            const seen = new Set();
            cells.forEach(cell => {
                const sid = cell.dataset.sid;
                if (!sid || seen.has(sid)) return;
                seen.add(sid);
                const a = map.get(sid);
                if (a) items.push(a);
            });
            return items;
        }

        // 悬停格 -> 当前显示的相关作品格集合
        // 第N名表头 = 该列；季度格 / 20世纪末聚合行合并格 = 该行；年份格 = 该年份区块
        function statsCellsOf(cell) {
            const body = document.getElementById('rank-table-body');
            if (!body) return [];
            const titleCellsOfRow = tr => Array.from(tr.querySelectorAll('td.title-col[data-sid]'));
            // 时间横轴：名次行 = 该行；季度表头 = 该列；年份表头 = 该年份所有列
            if (state.timeAxis === 'h') {
                if (cell.matches('td.col-rank')) {
                    const tr = cell.closest('tr');
                    return tr ? titleCellsOfRow(tr) : [];
                }
                if (cell.matches('th.col-quarter')) {
                    const gi = parseInt(cell.dataset.gi, 10);
                    if (isNaN(gi)) return [];
                    const out = [];
                    body.querySelectorAll('tr').forEach(tr => {
                        const tds = tr.querySelectorAll('td.title-col');
                        if (tds[gi] && tds[gi].dataset.sid) out.push(tds[gi]);
                    });
                    return out;
                }
                if (cell.matches('th.col-year')) {
                    const year = parseInt(cell.dataset.year, 10);
                    if (isNaN(year)) return [];
                    const out = [];
                    body.querySelectorAll('tr').forEach(tr => {
                        tr.querySelectorAll('td.title-col[data-sid]').forEach(td => {
                            if (parseInt(td.dataset.year, 10) === year) out.push(td);
                        });
                    });
                    return out;
                }
                return [];
            }
            if (cell.matches('th.rank-header')) {
                const headers = Array.from(document.querySelectorAll('#rank-table-head th.rank-header'));
                const idx = headers.indexOf(cell);
                if (idx < 0) return [];
                const out = [];
                body.querySelectorAll('tr').forEach(tr => {
                    const tds = tr.querySelectorAll('td.title-col');
                    if (tds[idx] && tds[idx].dataset.sid) out.push(tds[idx]);
                });
                return out;
            }
            const tr = cell.closest('tr');
            if (!tr) return [];
            if (cell.classList.contains('col-quarter')) {
                if (state.yearMode) return [];
                return titleCellsOfRow(tr);
            }
            if (cell.classList.contains('col-year') && cell.colSpan > 1) {
                return titleCellsOfRow(tr);
            }
            if (cell.classList.contains('col-year')) {
                const out = titleCellsOfRow(tr);
                let next = tr.nextElementSibling;
                while (next && !next.querySelector('td.col-year')) {
                    out.push(...titleCellsOfRow(next));
                    next = next.nextElementSibling;
                }
                return out;
            }
            return [];
        }

        // 三行统计：标签后直接写平均，括号内为范围(排名/热度取整，评分两位小数)
        function buildStatsRows(items) {
            const ranks = [], scores = [], pops = [];
            items.forEach(a => {
                const r = a.overall_rank;
                if (r != null && r < 999999) ranks.push(r);
                const s = a.score_exact != null ? Number(a.score_exact) : (a.score_num ? Number(a.score_num) : null);
                if (s != null) scores.push(s);
                if (a.pop_count != null) pops.push(Number(a.pop_count));
            });
            const avg = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
            // 每行返回 parts：文本片段 或 可计数数字(格式 int/num3)
            const line = (label, arr, fmt) => {
                const parts = [{ text: label + ': ' }];
                if (!arr.length) { parts.push({ text: '—' }); return parts; }
                parts.push({ num: avg(arr), fmt: fmt });
                parts.push({ text: ' (' });
                parts.push({ num: Math.min(...arr), fmt: fmt });
                parts.push({ text: ' - ' });
                parts.push({ num: Math.max(...arr), fmt: fmt });
                parts.push({ text: ')' });
                return parts;
            };
            return [
                line('排名', ranks, 'int'),
                line('评分', scores, 'num3'),
                line('热度', pops, 'int')
            ];
        }

        // 统计面板：对范围内作品的六维"前X%"取平均（仅统计有该值的作品）
        const STATS_PCT_FIELDS = ['pct_rank', 'pct_score', 'pct_cnt', 'pct_std', 'pct_pop', 'pct_rec'];
        function buildStatsRadarGraph(items) {
            const pcts = STATS_PCT_FIELDS.map(f => {
                const vals = items.map(a => a[f]).filter(v => v != null && v > 0);
                if (!vals.length) return null;
                return Math.round(vals.reduce((x, y) => x + y, 0) / vals.length);
            });
            return buildRadarFromPcts(pcts);
        }

        // 统计底栏：范围内平均排名 | 平均评分 | 平均热度
        function buildStatsFooter(items) {
            const ranks = [], scores = [], pops = [];
            items.forEach(a => {
                const r = a.overall_rank;
                if (r != null && r < 999999) ranks.push(r);
                const s = a.score_exact != null ? Number(a.score_exact) : (a.score_num ? Number(a.score_num) : null);
                if (s != null) scores.push(s);
                if (a.pop_count != null) pops.push(Number(a.pop_count));
            });
            const avg = arr => arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null;
            const foot = document.createElement('div');
            foot.className = 'tip-panel-footer';
            appendFooterNumbers(foot, [[avg(ranks), '名', 'int'], [avg(scores), '分', 'num3'], [avg(pops), '热度', 'int']]);
            return foot;
        }

        function buildStatsGrid(rows) {
            const grid = document.createElement('div');
            grid.className = 'custom-tip-rows stats-tip-rows';
            rows.forEach(parts => {
                const info = document.createElement('span');
                info.className = 'tip-label';
                parts.forEach(p => {
                    if (p.num !== undefined) {
                        const node = document.createElement('span');
                        tagNumber(node, p.num, p.fmt, '');
                        info.appendChild(node);
                    } else {
                        info.appendChild(document.createTextNode(p.text));
                    }
                });
                grid.appendChild(info);
            });
            return grid;
        }

        function positionStatsTip() {
            if (!statsTipVisible() || !statsTipCell) return;
            const el = statsTipEl;
            // 两种模式悬停框宽度统一固定 160px
            const w = 160;
            el.style.width = w + 'px';
            const rect = statsTipCell.getBoundingClientRect();
            const h = el.offsetHeight;
            if (statsTipCell.matches('th.rank-header, th.col-year, th.col-quarter')) {
                // 与"第N名"表头格水平居中对齐(数据/面板模式一致)，贴格子下方(空间不足转上方)
                let left = Math.round(rect.left + rect.width / 2 - w / 2);
                el.style.left = left + 'px';
                const areaBottom = (() => {
                    const box = statsTipCell.closest('.table-container');
                    return box ? box.getBoundingClientRect().bottom : window.innerHeight;
                })();
                let top = rect.bottom;
                if (top + h > areaBottom) top = rect.top - h;
                el.style.top = top + 'px';
            } else {
                // 年份/季度：紧贴格子右侧(无间隙)，与悬停格子垂直居中；右侧放不下(按表格容器右缘)时转到左侧
                const box = statsTipCell.closest('.table-container');
                const areaRight = box ? (box.getBoundingClientRect().left + box.clientLeft + box.clientWidth) : window.innerWidth;
                let left = Math.round(rect.right);
                if (left + w > areaRight) left = Math.round(rect.left - w);
                el.style.left = left + 'px';
                const top = Math.round(rect.top + (rect.height - h) / 2);
                el.style.top = top + 'px';
            }
            clipTipToTable(el, statsTipCell);
        }

        function hideStatsTip() {
            statsTipCell = null;
            if (statsTipEl) { stopTipAnim(statsTipEl); statsTipEl.style.display = 'none'; }
        }

        // 显示统计悬浮框：范围内无作品时不显示
        function showStatsTip(cell, force) {
            // 年份模式下"季度"列的空格(显示 —，纵轴为正文格/横轴为表头格)：选中/悬停均不弹面板
            if (cell && cell.matches('td.col-quarter, th.col-quarter') && cell.textContent.trim() === '—') {
                hideIconTip();
                hideStatsTip();
                hideWatchTip();
                return;
            }
            const items = statsItemsFromCells(statsCellsOf(cell));
            if (!items.length) { hideStatsTip(); return; }
            const el = getStatsTipEl();
            const key = tipCompositeKey();
            if (!force && statsTipVisible() && statsTipCell === cell && el.dataset.tipKey === key) {
                positionStatsTip();
                return;
            }
            const prevCell = statsTipCell;
            const wasVisible = statsTipVisible();
            const showRadar = state.tipRadar;
            const showDetail = state.tipDetail;
            el.classList.add('tip-panel');
            el.classList.toggle('footer-only', !showRadar && !showDetail);
            el.classList.toggle('tip-combined', showRadar && showDetail);
            el.dataset.tipKey = key;
            el.textContent = '';
            if (showRadar) el.appendChild(buildStatsRadarGraph(items));
            if (showDetail) {
                const block = document.createElement('div');
                block.className = 'tip-data-block';
                block.appendChild(buildStatsGrid(buildStatsRows(items)));
                el.appendChild(block);
            }
            if (!showDetail) el.appendChild(buildStatsFooter(items));
            // 周对比底栏：四种组合永远显示在最下方
            el.appendChild(buildStatsWeeklyFooter(items));
            el.style.display = 'block';
            hideIconTip();
            hideWatchTip();
            statsTipCell = cell;
            positionStatsTip();
            if (!wasVisible || prevCell !== cell) startTipEnter(el);
        }

        // ==================== 完成率悬浮提示 ====================
        // 紧贴完成率格子左侧显示：星星/绿圆/白圆三类标签各自对完成率的贡献(百分点)
        let watchTipEl = null;
        let watchTipCell = null;

        function getWatchTipEl() {
            if (!watchTipEl) {
                watchTipEl = document.createElement('div');
                watchTipEl.className = 'custom-tip';
                watchTipEl.style.display = 'none';
                document.body.appendChild(watchTipEl);
            }
            return watchTipEl;
        }

        function watchTipVisible() {
            return !!(watchTipEl && watchTipEl.style.display !== 'none');
        }

        function showWatchTip(cell) {
            const raw = cell.dataset ? cell.dataset.wctip : null;
            if (!raw) { hideWatchTip(); return; }
            const parts = raw.split('|').map(v => parseInt(v, 10) || 0);
            const keys = ['star', 'green', 'white'];
            const el = getWatchTipEl();
            if (watchTipVisible() && watchTipCell === cell) {
                positionWatchTip();
                return;
            }
            const prevCell = watchTipCell;
            const wasVisible = watchTipVisible();
            const grid = document.createElement('div');
            grid.className = 'custom-tip-rows stats-tip-rows';
            keys.forEach((k, i) => {
                const row = document.createElement('span');
                row.className = 'tip-label watch-tip-row';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'tip-icon';
                iconSpan.innerHTML = ICONS[k];
                const plus = document.createElement('span');
                plus.className = 'tip-plus';
                plus.textContent = '+';
                const num = document.createElement('span');
                num.className = 'tip-num';
                tagNumber(num, parts[i], 'int', '');
                const pctSign = document.createElement('span');
                pctSign.className = 'tip-percent';
                pctSign.textContent = '%';
                row.appendChild(iconSpan);
                row.appendChild(plus);
                row.appendChild(num);
                row.appendChild(pctSign);
                grid.appendChild(row);
            });
            el.textContent = '';
            el.appendChild(grid);
            el.style.display = 'block';
            hideIconTip();
            hideStatsTip();
            watchTipCell = cell;
            positionWatchTip();
            if (!wasVisible || prevCell !== cell) startTipEnter(el);
        }

        function positionWatchTip() {
            if (!watchTipVisible() || !watchTipCell) return;
            const el = watchTipEl;
            const rect = watchTipCell.getBoundingClientRect();
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            if (state.timeAxis === 'h') {
                // 横轴：完成率行固定在表格底部 → 悬停框贴紧格子上边、水平居中
                const left = Math.round(rect.left + rect.width / 2 - w / 2);
                el.style.left = left + 'px';
                el.style.top = Math.round(rect.top - h) + 'px';
                clipTipToTable(el, watchTipCell);
                return;
            }
            // 紧贴格子左侧(无间隙)；左侧放不下(按表格容器左缘)时转到右侧
            const box = watchTipCell.closest('.table-container');
            const areaLeft = box ? (box.getBoundingClientRect().left + box.clientLeft) : 0;
            let left = Math.round(rect.left - w);
            if (left < areaLeft) left = Math.round(rect.right);
            el.style.left = left + 'px';
            const top = Math.round(rect.top + (rect.height - h) / 2);
            el.style.top = top + 'px';
            clipTipToTable(el, watchTipCell);
        }

        function hideWatchTip() {
            watchTipCell = null;
            if (watchTipEl) { stopTipAnim(watchTipEl); watchTipEl.style.display = 'none'; }
        }

        window.onload = () => {
            applyUiSettingsSync(); // 首帧按上次的设置选对骨架轴
            buildTableHead();
            updateRankLabel();
            syncSliderLabelWidths();

            const yearMin = document.getElementById('year-min');
            const yearMax = document.getElementById('year-max');
            yearMin.max = state.currentYear + 2;
            yearMax.max = state.currentYear + 2;
            yearMin.value = 2000; // 默认 2000 年到当前年份
            yearMax.value = state.currentYear + 1;
            updateYearLabel();
            // 启动即绘制完整表格框架(作品/评级/完成率留空待数据)
            renderSkeleton();

            document.getElementById('sync-btn').addEventListener('click', syncUserData);
            // 上拉菜单：按钮切换显示/隐藏，菜单互斥，点击外部自动关闭
            function closeMenus() {
                document.getElementById('table-menu').style.display = 'none';
                document.getElementById('data-menu').style.display = 'none';
                document.getElementById('hide-menu').style.display = 'none';
            }
            function bindMenu(btnId, menuId) {
                document.getElementById(btnId).addEventListener('click', function(e) {
                    e.stopPropagation();
                    const menu = document.getElementById(menuId);
                    const wasOpen = menu.style.display !== 'none';
                    closeMenus();
                    menu.style.display = wasOpen ? 'none' : 'block';
                });
            }
            bindMenu('table-menu-btn', 'table-menu');
            bindMenu('data-menu-btn', 'data-menu');
            bindMenu('hide-filter-btn', 'hide-menu');
            document.addEventListener('click', function(e) {
                if (e.target.closest('.menu-wrap')) return;
                closeMenus();
            });
            // 左侧榜单标签：切换表格并同步隐藏 select 的值(所有视图切换逻辑仍以 #view-select 为准)
            document.querySelectorAll('#left-tabs .panel-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    const select = document.getElementById('view-select');
                    if (select.value !== tab.dataset.view) {
                        select.value = tab.dataset.view;
                        syncGradeByView();
                        renderTable();
                        // 切换表格后焦点归还搜索框，保证回车能继续跳转
                        if (searchState.isActive) document.getElementById('search-input').focus();
                    }
                });
            });
            // 隐藏项复选框：checked 与 state.filters 绑定，未勾选=隐藏对应项目，勾选变化立即重渲染表格
            [
                ['hide-compilation', 'showCompilation'],
                ['hide-shortmv', 'showShortMV'],
                ['hide-cn', 'showCN'],
                ['hide-western', 'showWestern'],
                ['hide-r18', 'showR18']
            ].forEach(function(pair) {
                const cb = document.getElementById(pair[0]);
                cb.checked = state.filters[pair[1]];
                cb.addEventListener('change', function() {
                    state.filters[pair[1]] = cb.checked;
                    renderTable();
                });
            });
            // 表格相关设置：时间倒序/顺序、评级重排/评级混排
            const swOrder = document.getElementById('sw-order');
            swOrder.checked = state.sortDescending;
            swOrder.addEventListener('change', toggleSort);
            // 数据显示设置：显示时机、六维面板、详细数据（互相独立）
            const swTipTrigger = document.getElementById('sw-tip-trigger');
            swTipTrigger.checked = state.tipTrigger === 'select';
            swTipTrigger.addEventListener('change', toggleTipTrigger);
            const swTipRadar = document.getElementById('sw-tip-radar');
            swTipRadar.checked = state.tipRadar;
            swTipRadar.addEventListener('change', toggleTipRadar);
            const swTipDetail = document.getElementById('sw-tip-detail');
            swTipDetail.checked = state.tipDetail;
            swTipDetail.addEventListener('change', toggleTipDetail);
            // 时间纵轴 / 时间横轴：行列互换
            const swTimeAxis = document.getElementById('sw-time-axis');
            swTimeAxis.checked = state.timeAxis === 'v';
            swTimeAxis.addEventListener('change', function() {
                state.timeAxis = swTimeAxis.checked ? 'v' : 'h';
                const toH = state.timeAxis === 'h';
